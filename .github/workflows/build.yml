name: jokerx04.com 빌드 및 배포

on:
  workflow_dispatch: # 수동 실행

permissions:
  contents: write    # 코드 푸시 권한
  pages: write       # Pages 배포 권한
  id-token: write

# 1. 워크플로우 단위 동시성 제어: 새 수동 실행이 들어오면 이전 빌드 작업을 즉시 취소하고 최신 것만 진행
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Next.js 빌드 (next.config.js에 output: 'export' 설정 필요)
      - name: Run Next.js Build
        run: npm run build

      # GitHub Pages 정적 배포(단일 페이지 앱 라우팅 보완용 404.html 대응)
      - name: Create 404.html for GitHub Pages routing
        run: |
          if [ -f "out/404.html" ]; then
            echo "404.html already exists from Next.js export"
          elif [ -f "out/index.html" ]; then
            cp out/index.html out/404.html
          fi

      # out 디렉토리 및 sitemap 커밋 & 푸시
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add -f out public/sitemap.xml

          if ! git diff --staged --quiet; then
            git commit -m "chore: automated build update out & sitemap [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi

      # GitHub Pages 배포 아티팩트 업로드 (Next.js 정적 출력 디렉토리인 out 지정)
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'out'

  # 2. 배포 Job 분리: Pages 배포 전용 concurrency 격리 적용
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
