name: React 빌드 및 배포

on:
  workflow_dispatch: # 수동 실행

permissions:
  contents: write    # 리포지토리 dist 폴더 푸시 권한
  pages: write       # GitHub Pages 배포 권한
  id-token: write    # Pages OIDC 인증 권한

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Build
        # dist 폴더 생성
        run: npm run build

      # 1. 실제 리포지토리의 dist 폴더로 커밋 및 푸시
      - name: Commit and push dist to repository
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add -f dist

          if git diff --staged --quiet; then
            echo "dist 폴더에 변경 사항이 없습니다."
          else
            git commit -m "chore: automated build update dist [skip ci]"
            git push origin main
          fi

      # 2. GitHub Pages 배포용 아티팩트 업로드
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist' # dist 폴더 자체를 웹사이트 루트로 지정

  # 3. GitHub Pages 호스팅 서버로 즉시 배포
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
