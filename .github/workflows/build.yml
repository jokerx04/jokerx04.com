name: jokerx04.com 빌드 및 배포

on:
  workflow_dispatch: # 수동 실행

permissions:
  contents: write    # 코드 푸시 권한
  pages: write       # Pages 배포 권한
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # 1. 빌드 전에 sitemap.xml을 public 폴더에 먼저 생성
      - name: Generate Sitemap
        run: |
          mkdir -p public
          echo '<?xml version="1.0" encoding="UTF-8"?>' > public/sitemap.xml
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> public/sitemap.xml
          
          if [ -d "page" ]; then
            find page -name "*.html" -type f | while read file; do
              echo "  <url>" >> public/sitemap.xml
              echo "    <loc>https://jokerx04.com/$file</loc>" >> public/sitemap.xml
              echo "    <lastmod>$(date +%Y-%m-%d)</lastmod>" >> public/sitemap.xml
              echo "  </url>" >> public/sitemap.xml
            done
          fi
          
          echo '</urlset>' >> public/sitemap.xml

      # 2. React 빌드 (public/sitemap.xml 이 자동으로 dist/sitemap.xml 에 포함됨)
      - name: Run Build
        run: npm run build

      # 2-1. GitHub Pages SPA 라우팅 지원용 404.html 복제 생성
      - name: Create 404.html for GitHub Pages SPA routing
        run: cp dist/index.html dist/404.html

      # 3. dist 폴더(404.html 포함) 및 생성된 public/sitemap.xml 리포지토리 커밋 & 푸시
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add -f dist public/sitemap.xml

          if ! git diff --staged --quiet; then
            git commit -m "chore: automated build update dist & sitemap [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi

      # 4. GitHub Pages 호스팅 서버로 즉시 배포
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
