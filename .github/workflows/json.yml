name: JSON 데이터 배포

on:
  workflow_dispatch: # 수동 실행
  push:
    branches:
      - main
    paths:
      - 'public/**/*.json'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 동시성 충돌 방지를 위해 최신 main 브랜치 상태 강제 동기화 (out 디렉토리 포함)
      - name: Pull latest changes
        run: |
          git pull origin main

      - name: Prepare deployment directory
        run: |
          mkdir -p dist
          # out 디렉토리가 존재하면 dist로 복사하여 기존 웹 구조 유지
          if [ -d "out" ]; then
            cp -r out/* dist/
          fi
          # 변경된 JSON 파일 반영
          cp -r public/* dist/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
