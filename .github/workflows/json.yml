name: json 빌드 및 배포

on:
  push:
    paths:
      - 'public/**/*.json' # public 하위 어디에 있든 모든 json 감지
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # public 내부의 최신 json 파일들을 배포 대상인 dist 디렉토리로 동기화 복사
      - name: Sync updated public files to dist
        run: |
          mkdir -p dist
          cp -r public/* dist/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # dist 폴더만 웹 사이트 루트로 패키징하여 안전하게 배포
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
