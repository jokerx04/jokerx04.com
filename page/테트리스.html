<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>클래식 테트리스</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at center, #150d2a 0%, #080511 100%);
      --text-main: #f8fafc;
      --text-sub: #a78bfa;
      --text-accent: #00f5ff;
      --panel-bg: rgba(22, 16, 43, 0.85);
      --panel-border: rgba(217, 70, 239, 0.35);
      --panel-shadow: rgba(168, 85, 247, 0.25);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --board-border-grad: linear-gradient(135deg, #00f5ff, #d946ef, #ff0055);
      --board-shadow: rgba(0, 245, 255, 0.3);
      --btn-bg: #2b1b54;
      --btn-border: #00f5ff;
      --btn-text: #00f5ff;
      --btn-active-bg: #d946ef;
      --score-color: #00f5ff;
      --lines-color: #00ff66;
      --level-color: #ffe600;
      --touch-btn-bg: rgba(255, 255, 255, 0.15);
      --touch-btn-border: rgba(0, 245, 255, 0.5);
      --touch-btn-active: rgba(0, 245, 255, 0.6);
      --touch-border: rgba(217, 70, 239, 0.5);
    }

    body[data-theme="retro"] {
      --bg-gradient: radial-gradient(circle at center, #1a0033 0%, #000000 100%);
      --text-main: #ffffff;
      --text-sub: #ffcc00;
      --text-accent: #00ffff;
      --panel-bg: rgba(10, 0, 20, 0.9);
      --panel-border: rgba(255, 0, 85, 0.5);
      --panel-shadow: rgba(255, 0, 85, 0.3);
      --card-bg: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 204, 0, 0.2);
      --board-border-grad: linear-gradient(135deg, #ff0055, #ffcc00, #00ccff);
      --board-shadow: rgba(255, 0, 85, 0.35);
      --btn-bg: #330033;
      --btn-border: #ff0055;
      --btn-text: #ff0055;
      --btn-active-bg: #ffcc00;
      --score-color: #ff0055;
      --lines-color: #ffcc00;
      --level-color: #00ccff;
      --touch-border: rgba(255, 0, 85, 0.6);
      --touch-btn-border: rgba(255, 204, 0, 0.6);
      --touch-btn-active: rgba(255, 0, 85, 0.6);
    }

    body[data-theme="pastel"] {
      --bg-gradient: radial-gradient(circle at center, #2e263d 0%, #15121e 100%);
      --text-main: #f1f5f9;
      --text-sub: #c084fc;
      --text-accent: #67e8f9;
      --panel-bg: rgba(35, 28, 48, 0.85);
      --panel-border: rgba(192, 132, 252, 0.4);
      --panel-shadow: rgba(192, 132, 252, 0.2);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --board-border-grad: linear-gradient(135deg, #67e8f9, #c084fc, #fda4af);
      --board-shadow: rgba(103, 232, 249, 0.25);
      --btn-bg: #2d2440;
      --btn-border: #67e8f9;
      --btn-text: #67e8f9;
      --btn-active-bg: #c084fc;
      --score-color: #67e8f9;
      --lines-color: #86efac;
      --level-color: #fde047;
      --touch-border: rgba(192, 132, 252, 0.5);
      --touch-btn-border: rgba(103, 232, 249, 0.5);
      --touch-btn-active: rgba(192, 132, 252, 0.5);
    }

    body[data-theme="mono"] {
      --bg-gradient: radial-gradient(circle at center, #24242e 0%, #0f0f13 100%);
      --text-main: #ffffff;
      --text-sub: #94a3b8;
      --text-accent: #e2e8f0;
      --panel-bg: rgba(24, 24, 30, 0.9);
      --panel-border: rgba(255, 255, 255, 0.25);
      --panel-shadow: rgba(0, 0, 0, 0.5);
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --board-border-grad: linear-gradient(135deg, #ffffff, #94a3b8, #475569);
      --board-shadow: rgba(255, 255, 255, 0.15);
      --btn-bg: #22222a;
      --btn-border: #94a3b8;
      --btn-text: #ffffff;
      --btn-active-bg: #64748b;
      --score-color: #ffffff;
      --lines-color: #cbd5e1;
      --level-color: #e2e8f0;
      --touch-border: rgba(255, 255, 255, 0.3);
      --touch-btn-border: rgba(255, 255, 255, 0.4);
      --touch-btn-active: rgba(255, 255, 255, 0.3);
    }

    body[data-theme="emerald"] {
      --bg-gradient: radial-gradient(circle at center, #06241b 0%, #020d0a 100%);
      --text-main: #ecfdf5;
      --text-sub: #6ee7b7;
      --text-accent: #10b981;
      --panel-bg: rgba(6, 36, 27, 0.88);
      --panel-border: rgba(16, 185, 129, 0.4);
      --panel-shadow: rgba(16, 185, 129, 0.25);
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(16, 185, 129, 0.15);
      --board-border-grad: linear-gradient(135deg, #34d399, #06b6d4, #84cc16);
      --board-shadow: rgba(16, 185, 129, 0.3);
      --btn-bg: #0b382b;
      --btn-border: #34d399;
      --btn-text: #34d399;
      --btn-active-bg: #10b981;
      --score-color: #34d399;
      --lines-color: #6ee7b7;
      --level-color: #bef264;
      --touch-border: rgba(16, 185, 129, 0.5);
      --touch-btn-border: rgba(52, 211, 153, 0.5);
      --touch-btn-active: rgba(16, 185, 129, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      touch-action: manipulation;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
      overflow-y: auto;
      position: relative;
      padding: env(safe-area-inset-top, 6px) 6px calc(env(safe-area-inset-bottom, 6px) + 8px) 6px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* 반응형 메인 컨테이너 (JS로 최적 너비 실시간 동기화) */
    .main-app-container {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      width: 100%;
      max-width: 280px;
      gap: 6px;
      margin: auto 0;
      transition: max-width 0.15s ease-out;
    }

    /* 상단 통합 설정 라인 */
    .top-bar {
      display: flex;
      gap: 4px;
      align-items: center;
      background: var(--panel-bg);
      padding: 5px 6px;
      border-radius: 10px;
      border: 1px solid var(--panel-border);
      box-shadow: 0 0 12px var(--panel-shadow);
      justify-content: space-between;
      width: 100%;
      z-index: 20;
    }
    .btn {
      padding: 5px 6px;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid var(--btn-border);
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 11px;
      white-space: nowrap;
      flex: 1;
      text-align: center;
    }
    .btn:hover {
      background: var(--btn-text);
      color: #080511;
      box-shadow: 0 0 8px var(--btn-text);
    }
    .btn-toggle {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--text-sub);
      color: var(--text-sub);
    }
    .btn-toggle.on {
      background: rgba(0, 245, 255, 0.2);
      border-color: var(--text-accent);
      color: var(--text-accent);
      box-shadow: 0 0 8px var(--panel-shadow);
    }
    .btn-pause {
      background: rgba(255, 230, 0, 0.15);
      border: 1px solid #ffe600;
      color: #ffe600;
    }
    .btn-ready {
      background: #ffe600;
      color: #080511;
      border: none;
      font-size: 13px;
      padding: 8px 18px;
      box-shadow: 0 0 12px rgba(255, 230, 0, 0.5);
      border-radius: 6px;
      font-weight: 800;
      cursor: pointer;
    }

    .option-select-box {
      display: flex;
      align-items: center;
      gap: 2px;
      background: rgba(0, 0, 0, 0.4);
      padding: 3px 4px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      font-size: 10px;
      color: var(--text-main);
    }
    select {
      background: var(--btn-bg);
      color: var(--text-accent);
      border: 1px solid var(--panel-border);
      padding: 2px 2px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
      max-width: 56px;
    }

    /* 점수 현황판 */
    .top-stats-card {
      width: 100%;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 6px 8px;
      box-shadow: 0 0 12px var(--panel-shadow);
    }
    .scores-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      text-align: center;
    }
    .score-box h2 {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 1px;
    }
    .score-box p {
      font-size: 16px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      color: var(--score-color);
      text-shadow: 0 0 8px var(--score-color);
    }

    /* 게임 보드 영역 */
    .game-arena-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }
    .board-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .canvas-container {
      position: relative;
      border-radius: 8px;
      padding: 3px;
      background: var(--board-border-grad);
      box-shadow: 0 0 15px var(--board-shadow);
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }
    canvas {
      background-color: #06030e;
      border-radius: 5px;
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    /* 게임 오버레이 */
    .game-overlay {
      display: flex;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(6, 3, 14, 0.92);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 6px;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 8px;
      z-index: 15;
      padding: 6px;
      width: 100%;
    }
    .overlay-text {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-align: center;
    }
    .overlay-text.lose { color: #ff0055; text-shadow: 0 0 12px #ff0055; }
    
    .start-setup-box {
      display: flex;
      flex-direction: column;
      gap: 5px;
      width: 92%;
      max-width: 220px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      padding: 6px 8px;
      border-radius: 8px;
    }
    .start-setup-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10.5px;
      color: var(--text-main);
      width: 100%;
      white-space: nowrap;
    }
    .start-setup-row span {
      flex: 1;
      text-align: left;
      font-weight: 600;
    }
    .start-setup-row select {
      flex: 1.2;
      max-width: 110px;
      font-size: 10.5px;
      padding: 2px 4px;
    }

    /* PC 키 안내 */
    .controls-guide-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 9.5px;
      color: var(--text-sub);
      text-align: center;
      line-height: 1.4;
      width: 100%;
    }
    .key-badge {
      display: inline-block;
      padding: 1px 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      color: var(--text-accent);
      font-weight: 600;
      font-size: 8.5px;
    }

    /* 모바일 터치 패드 */
    .touch-bottom-panel {
      display: none;
      width: 100%;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      background: var(--panel-bg);
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      z-index: 30;
      touch-action: none;
    }
    .touch-bottom-panel.active {
      display: flex;
    }

    .dpad-box {
      display: grid;
      grid-template-columns: repeat(3, 38px);
      grid-template-rows: repeat(2, 36px);
      gap: 3px;
      justify-items: center;
      align-items: center;
    }
    .t-btn {
      width: 38px;
      height: 36px;
      background: var(--touch-btn-bg);
      border: 1.5px solid var(--touch-btn-border);
      border-radius: 7px;
      color: var(--text-main);
      font-size: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    .t-btn:active, .t-btn.touched {
      background: var(--touch-btn-active) !important;
      border-color: var(--text-accent) !important;
      color: #fff !important;
      transform: scale(0.92);
    }
    #v-up    { grid-column: 2; grid-row: 1; }
    #v-left  { grid-column: 1; grid-row: 2; }
    #v-down  { grid-column: 2; grid-row: 2; }
    #v-right { grid-column: 3; grid-row: 2; }

    .action-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: center;
    }
    .act-btn-drop {
      width: 58px;
      height: 58px;
      background: var(--touch-btn-bg);
      border: 2px solid var(--touch-btn-border);
      border-radius: 50%;
      color: var(--text-accent);
      font-size: 10px;
      font-weight: 900;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      box-shadow: 0 0 10px var(--touch-border);
    }
    .act-btn-drop span {
      font-size: 16px;
      line-height: 1;
      margin-bottom: 2px;
    }
    .act-btn-drop:active, .act-btn-drop.touched {
      background: var(--text-accent) !important;
      color: #080511 !important;
      transform: scale(0.92);
    }
  </style>
</head>
<body>

  <div class="main-app-container" id="main-container">
    
    <!-- 1. 상단 통합 설정 라인 -->
    <div class="top-bar" id="top-bar">
      <button id="btn-keypad-toggle" class="btn btn-toggle" onclick="toggleVirtualKeypad()">🎮 패드</button>
      <button id="btn-ghost-toggle" class="btn btn-toggle on" onclick="toggleGhost()">👁️ 가이드</button>
      <button id="btn-pause" class="btn btn-pause" onclick="togglePause()">⏸️ 정지</button>

      <div class="option-select-box">
        <span>🎨</span>
        <select id="theme-selector" onchange="changeTheme(this.value)">
          <option value="neon">네온</option>
          <option value="retro">레트로</option>
          <option value="pastel">파스텔</option>
          <option value="mono">모노</option>
          <option value="emerald">에메랄드</option>
        </select>
      </div>
    </div>

    <!-- 2. 점수 현황판 -->
    <div class="top-stats-card" id="stats-card">
      <div class="scores-grid">
        <div class="score-box">
          <h2>점수</h2>
          <p id="score">0</p>
        </div>
        <div class="score-box">
          <h2>줄</h2>
          <p id="lines" style="color: var(--lines-color);">0</p>
        </div>
        <div class="score-box">
          <h2>단계</h2>
          <p id="level" style="color: var(--level-color);">1</p>
        </div>
      </div>
    </div>

    <!-- 3. 게임 캔버스 영역 -->
    <div class="game-arena-wrapper">
      <div class="board-container">
        <div class="canvas-container" id="canvas-wrapper">
          <canvas id="tetris" width="270" height="540"></canvas>
          
          <div id="game-overlay" class="game-overlay">
            <div id="overlay-msg" class="overlay-text" style="color: var(--text-accent);">준비 완료</div>
            
            <div id="single-setup-box" class="start-setup-box">
              <div class="start-setup-row">
                <span>보드 크기</span>
                <select id="single-board-size" onchange="onBoardSizeChange(this.value)">
                  <option value="small">소형 (8×16)</option>
                  <option value="standard" selected>표준 (10×20)</option>
                  <option value="wide">와이드 (12×20)</option>
                  <option value="large">대형 (12×24)</option>
                  <option value="giant">특대형 (14×26)</option>
                </select>
              </div>
              <div class="start-setup-row">
                <span>시작 단계</span>
                <select id="single-start-level" onchange="onStartLevelChange(this.value)">
                  <option value="1" selected>1단계</option>
                  <option value="2">2단계</option>
                  <option value="3">3단계</option>
                  <option value="4">4단계</option>
                  <option value="5">5단계</option>
                  <option value="6">6단계</option>
                  <option value="7">7단계</option>
                  <option value="8">8단계</option>
                  <option value="9">9단계</option>
                  <option value="10">10단계</option>
                </select>
              </div>
            </div>

            <button id="overlay-btn" class="btn-ready" onclick="startGame()">게임 시작</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 4. PC 키 조작 안내 -->
    <div class="controls-guide-card" id="guide-card">
      <strong style="color: var(--text-main);">🎮 PC 키:</strong>
      <span class="key-badge">←</span> <span class="key-badge">→</span> 이동 |
      <span class="key-badge">↑</span> 회전 |
      <span class="key-badge">Space</span> 낙하
    </div>

    <!-- 5. 모바일 터치 패드 -->
    <div class="touch-bottom-panel" id="touch-bottom-panel">
      <div class="dpad-box">
        <div class="t-btn" id="v-up" data-act="rot">▲</div>
        <div class="t-btn" id="v-left" data-act="left">◀</div>
        <div class="t-btn" id="v-down" data-act="down">▼</div>
        <div class="t-btn" id="v-right" data-act="right">▶</div>
      </div>

      <div class="action-box">
        <div class="act-btn-drop" id="v-drop" data-act="hard">
          <span>⚡</span>
          낙하
        </div>
      </div>
    </div>

  </div>

<script>
/* 1. 설정 및 테마 */
const BOARD_SIZES = {
  small:    { cols: 8,  rows: 16, blockSize: 30 },
  standard: { cols: 10, rows: 20, blockSize: 28 },
  wide:     { cols: 12, rows: 20, blockSize: 26 },
  large:    { cols: 12, rows: 24, blockSize: 24 },
  giant:    { cols: 14, rows: 26, blockSize: 22 }
};

let currentBoardSizeKey = 'standard';
let COLS = BOARD_SIZES.standard.cols;
let ROWS = BOARD_SIZES.standard.rows;
let BLOCK_SIZE = BOARD_SIZES.standard.blockSize;

const THEMES = {
  neon: [
    null,
    { base: '#D946EF', light: '#F0ABFC', glow: 'rgba(217, 70, 239, 0.8)' },
    { base: '#00F5FF', light: '#A5F3FC', glow: 'rgba(0, 245, 255, 0.8)' },
    { base: '#00FF66', light: '#86EFAC', glow: 'rgba(0, 255, 102, 0.8)' },
    { base: '#FF0055', light: '#FDA4AF', glow: 'rgba(255, 0, 85, 0.8)' },
    { base: '#FF7700', light: '#FDBA74', glow: 'rgba(255, 119, 0, 0.8)' },
    { base: '#FFE600', light: '#FEF08A', glow: 'rgba(255, 230, 0, 0.8)' },
    { base: '#3B82F6', light: '#93C5FD', glow: 'rgba(59, 130, 246, 0.8)' },
    { base: '#64748B', light: '#94A3B8', glow: 'rgba(100, 116, 139, 0.8)' }
  ],
  retro: [
    null,
    { base: '#FF0055', light: '#FF80A0', glow: 'rgba(255, 0, 85, 0.8)' },
    { base: '#00CCFF', light: '#80E5FF', glow: 'rgba(0, 204, 255, 0.8)' },
    { base: '#00FF66', light: '#80FFB3', glow: 'rgba(0, 255, 102, 0.8)' },
    { base: '#FFCC00', light: '#FFE680', glow: 'rgba(255, 204, 0, 0.8)' },
    { base: '#FF6600', light: '#FFB380', glow: 'rgba(255, 102, 0, 0.8)' },
    { base: '#CC00FF', light: '#E580FF', glow: 'rgba(204, 0, 255, 0.8)' },
    { base: '#0066FF', light: '#80B3FF', glow: 'rgba(0, 102, 255, 0.8)' },
    { base: '#555555', light: '#888888', glow: 'rgba(85, 85, 85, 0.8)' }
  ],
  pastel: [
    null,

let currentThemeKey = localStorage.getItem('tetris_theme') || 'neon';
let PALETTE = THEMES[currentThemeKey];

function changeTheme(themeKey) {
  if (THEMES[themeKey]) {
    currentThemeKey = themeKey;
    PALETTE = THEMES[themeKey];
    document.body.setAttribute('data-theme', themeKey);
    localStorage.setItem('tetris_theme', themeKey);
  }
}
document.body.setAttribute('data-theme', currentThemeKey);

/* 2. 반응형 레이아웃 계산 엔진 */
let ghostEnabled = true;
let startLevel = 1;
let isPaused = false;

function updateResponsiveLayout() {
  const container = document.getElementById('main-container');
  const dpad = document.getElementById('touch-bottom-panel');
  const isDpadVisible = dpad && dpad.classList.contains('active');

  const vh = window.innerHeight;
  const vw = window.innerWidth;

  // 헤더, 점수판, 안내, 여백의 높이를 합산하여 캔버스 가용 높이 계산
  const reservedHeight = isDpadVisible ? 220 : 140;
  const availableCanvasHeight = Math.max(180, vh - reservedHeight);

  // 보드의 가로/세로 비율에 맞춰 가로폭 계산
  const boardRatio = COLS / ROWS;
  let targetWidth = availableCanvasHeight * boardRatio;

  // 화면 너비 기준 최소/최대 제한
  const maxAllowedWidth = Math.min(vw - 16, 420);
  const minAllowedWidth = 220;

  targetWidth = Math.min(Math.max(targetWidth, minAllowedWidth), maxAllowedWidth);
  container.style.maxWidth = `${Math.round(targetWidth)}px`;
}

window.addEventListener('resize', updateResponsiveLayout);
window.addEventListener('orientationchange', updateResponsiveLayout);

function applyBoardSize(sizeKey) {
  const cfg = BOARD_SIZES[sizeKey] || BOARD_SIZES.standard;
  currentBoardSizeKey = sizeKey;
  COLS = cfg.cols;
  ROWS = cfg.rows;
  BLOCK_SIZE = cfg.blockSize;

  canvas.width = COLS * BLOCK_SIZE;
  canvas.height = ROWS * BLOCK_SIZE;

  updateResponsiveLayout();
}

function onBoardSizeChange(sizeKey) {
  if (!player.isPlaying) {
    applyBoardSize(sizeKey);
    resetGameBoard(startLevel);
  }
}

function onStartLevelChange(lvl) {
  const parsed = parseInt(lvl, 10) || 1;
  if (!player.isPlaying) {
    startLevel = parsed;
    player.level = startLevel;
    dropInterval = Math.max(80, 800 - (player.level - 1) * 70);
    updateScore();
  }
}

function toggleGhost() {
  ghostEnabled = !ghostEnabled;
  const btn = document.getElementById('btn-ghost-toggle');
  if (ghostEnabled) {
    btn.classList.add('on');
    btn.innerText = '👁️ 가이드';
  } else {
    btn.classList.remove('on');
    btn.innerText = '👁️ 꺼짐';
  }
}

function togglePause() {
  if (!player.isPlaying) return;
  isPaused = !isPaused;
  const overlay = document.getElementById('game-overlay');
  const msg = document.getElementById('overlay-msg');
  const btn = document.getElementById('overlay-btn');
  const pauseBtn = document.getElementById('btn-pause');
  const setupBox = document.getElementById('single-setup-box');

  if (isPaused) {
    overlay.style.display = 'flex';
    setupBox.style.display = 'none';
    msg.innerText = "일시 정지됨";
    msg.className = "overlay-text";
    msg.style.color = "#ffe600";
    btn.innerText = "계속하기";
    pauseBtn.innerText = "▶️ 계속";
  } else {
    overlay.style.display = 'none';
    pauseBtn.innerText = "⏸️ 정지";
  }
}

/* 3. 게임 엔진 */
const canvas = document.getElementById('tetris');
const context = canvas.getContext('2d');
const scoreElement = document.getElementById('score');
const linesElement = document.getElementById('lines');
const levelElement = document.getElementById('level');

function createPiece(type) {
  switch (type) {
    case 'T': return [[0, 1, 0], [1, 1, 1], [0, 0, 0]];
    case 'I': return [[0, 2, 0, 0], [0, 2, 0, 0], [0, 2, 0, 0], [0, 2, 0, 0]];
    case 'S': return [[0, 3, 3], [3, 3, 0], [0, 0, 0]];
    case 'Z': return [[4, 4, 0], [0, 4, 4], [0, 0, 0]];
    case 'L': return [[0, 5, 0], [0, 5, 0], [0, 5, 5]];
    case 'O': return [[6, 6], [6, 6]];
    case 'J': return [[0, 7, 0], [0, 7, 0], [7, 7, 0]];
  }
}

function createMatrix(w, h) {
  const matrix = [];
  while (h--) matrix.push(new Array(w).fill(0));
  return matrix;
}

let arena = createMatrix(COLS, ROWS);

const player = {
  pos: { x: 0, y: 0 },
  matrix: null,
  score: 0,
  lines: 0,
  level: 1,
  isPlaying: false
};

function collide(arenaTarget, piece) {
  const [m, o] = [piece.matrix, piece.pos];
  for (let y = 0; y < m.length; ++y) {
    for (let x = 0; x < m[y].length; ++x) {
      if (m[y][x] !== 0 &&
          (arenaTarget[y + o.y] && arenaTarget[y + o.y][x + o.x]) !== 0) {
        return true;
      }
    }
  }
  return false;
}

function merge(arenaTarget, p) {
  p.matrix.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value !== 0) arenaTarget[y + p.pos.y][x + p.pos.x] = value;
    });
  });
}

function rotate(matrix, dir) {
  for (let y = 0; y < matrix.length; ++y) {
    for (let x = 0; x < y; ++x) {
      [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
    }
  }
  if (dir > 0) matrix.forEach(row => row.reverse());
  else matrix.reverse();
}

function playerRotate(dir) {
  if (!player.isPlaying || isPaused) return;
  const pos = player.pos.x;
  let offset = 1;
  rotate(player.matrix, dir);
  while (collide(arena, player)) {
    player.pos.x += offset;
    offset = -(offset + (offset > 0 ? 1 : -1));
    if (offset > player.matrix[0].length) {
      rotate(player.matrix, -dir);
      player.pos.x = pos;
      return;
    }
  }
  resetLockDelay();
}

function playerMove(dir) {
  if (!player.isPlaying || isPaused) return;
  player.pos.x += dir;
  if (collide(arena, player)) {
    player.pos.x -= dir;
  } else {
    resetLockDelay();
  }
}

let lockTimer = 0;
const LOCK_DELAY = 450;
let lockResets = 0;
const MAX_LOCK_RESETS = 12;

function isGrounded() {
  player.pos.y++;
  const grounded = collide(arena, player);
  player.pos.y--;
  return grounded;
}

function resetLockDelay() {
  if (isGrounded() && lockResets < MAX_LOCK_RESETS) {
    lockTimer = 0;
    lockResets++;
  }
}

function lockPiece() {
  merge(arena, player);
  arenaSweep();
  playerReset();
  lockTimer = 0;
  lockResets = 0;
}

function playerDrop() {
  if (!player.isPlaying || isPaused) return false;
  player.pos.y++;
  if (collide(arena, player)) {
    player.pos.y--;
    return false;
  }
  dropCounter = 0;
  return true;
}

function playerHardDrop() {
  if (!player.isPlaying || isPaused) return;
  while (!collide(arena, player)) {
    player.pos.y++;
  }
  player.pos.y--;
  lockPiece();
}

function getGhostPosition() {
  const ghost = {
    pos: { x: player.pos.x, y: player.pos.y },
    matrix: player.matrix
  };
  while (!collide(arena, ghost)) {
    ghost.pos.y++;
  }
  ghost.pos.y--;
  return ghost;
}

function arenaSweep() {
  let rowCount = 0;
  outer: for (let y = arena.length - 1; y >= 0; --y) {
    for (let x = 0; x < arena[y].length; ++x) {
      if (arena[y][x] === 0) continue outer;
    }
    const rowColors = arena[y].map(val => (PALETTE[val] ? PALETTE[val].base : '#fff'));
    spawnParticles(y, rowColors);

    const row = arena.splice(y, 1)[0].fill(0);
    arena.unshift(row);
    ++y;
    rowCount++;
  }

  if (rowCount > 0) {
    const lineScores = [0, 100, 300, 500, 800];
    player.score += (lineScores[rowCount] || 1000) * player.level;
    player.lines += rowCount;
    player.level = startLevel + Math.floor(player.lines / 10);
    dropInterval = Math.max(80, 800 - (player.level - 1) * 70);
    updateScore();
  }
}

function playerReset() {
  const pieces = 'ILJOTSZ';
  player.matrix = createPiece(pieces[Math.floor(pieces.length * Math.random())]);
  player.pos.y = 0;
  player.pos.x = Math.floor(COLS / 2) - Math.floor(player.matrix[0].length / 2);

  if (collide(arena, player)) {
    triggerGameOver();
  }
}

function triggerGameOver() {
  player.isPlaying = false;
  isPaused = false;
  const overlay = document.getElementById('game-overlay');
  const msg = document.getElementById('overlay-msg');
  const btn = document.getElementById('overlay-btn');
  const setupBox = document.getElementById('single-setup-box');
  const pauseBtn = document.getElementById('btn-pause');

  overlay.style.display = 'flex';
  setupBox.style.display = 'flex';
  msg.innerText = "게임 종료";
  msg.className = "overlay-text lose";
  btn.innerText = '다시 시작';
  pauseBtn.innerText = "⏸️ 정지";
}

function updateScore() {
  scoreElement.innerText = player.score.toLocaleString();
  linesElement.innerText = player.lines;
  levelElement.innerText = player.level;
}

function startGame() {
  if (isPaused) {
    togglePause();
    return;
  }
  startLevel = parseInt(document.getElementById('single-start-level').value, 10) || 1;
  const selectedSize = document.getElementById('single-board-size').value;
  applyBoardSize(selectedSize);

  document.getElementById('game-overlay').style.display = 'none';
  resetGameBoard(startLevel);
  player.isPlaying = true;
  playerReset();
}

function resetGameBoard(lvl = 1) {
  arena = createMatrix(COLS, ROWS);
  player.score = 0;
  player.lines = 0;
  player.level = lvl;
  dropInterval = Math.max(80, 800 - (player.level - 1) * 70);
  updateScore();
}

/* 4. 파티클 이펙트 */
const particles = [];
function spawnParticles(y, colors) {
  for (let x = 0; x < COLS; x++) {
    for (let i = 0; i < 2; i++) {
      particles.push({
        x: x * BLOCK_SIZE + BLOCK_SIZE / 2,
        y: y * BLOCK_SIZE + BLOCK_SIZE / 2,
        vx: (Math.random() - 0.5) * 5,
        vy: (Math.random() - 0.5) * 5 - 1.5,
        size: Math.random() * 3 + 2,
        color: colors[Math.floor(Math.random() * colors.length)],
        alpha: 1,
        decay: Math.random() * 0.02 + 0.02
      });
    }
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.alpha -= p.decay;
    if (p.alpha <= 0) particles.splice(i, 1);
  }
}

function drawParticles(ctx) {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 6;
    ctx.fillRect(p.x, p.y, p.size, p.size);
    ctx.restore();
  });
}

/* 5. 보드 렌더링 */
function drawBlock(ctx, x, y, paletteIdx, isGhost = false) {
  const px = x * BLOCK_SIZE;
  const py = y * BLOCK_SIZE;
  const item = PALETTE[paletteIdx];
  if (!item) return;

  if (isGhost) {
    ctx.save();
    ctx.strokeStyle = item.glow;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(px + 1.5, py + 1.5, BLOCK_SIZE - 3, BLOCK_SIZE - 3);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
    ctx.fillRect(px + 1.5, py + 1.5, BLOCK_SIZE - 3, BLOCK_SIZE - 3);
    ctx.restore();
    return;
  }

  ctx.save();
  const grad = ctx.createLinearGradient(px, py, px + BLOCK_SIZE, py + BLOCK_SIZE);
  grad.addColorStop(0, item.light);
  grad.addColorStop(0.3, item.base);
  grad.addColorStop(1, '#05020a');

  ctx.fillStyle = grad;
  ctx.fillRect(px + 1, py + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);

  ctx.strokeStyle = item.light;
  ctx.lineWidth = 1;
  ctx.strokeRect(px + 2, py + 2, BLOCK_SIZE - 4, BLOCK_SIZE - 4);
  ctx.restore();
}

function renderBoard(ctx, boardArena, activePlayer = null) {
  ctx.fillStyle = '#06030e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
  ctx.lineWidth = 1;
  for (let x = 0; x < COLS; x++) {
    ctx.beginPath();
    ctx.moveTo(x * BLOCK_SIZE, 0);
    ctx.lineTo(x * BLOCK_SIZE, canvas.height);
    ctx.stroke();
  }
  for (let y = 0; y < ROWS; y++) {
    ctx.beginPath();
    ctx.moveTo(0, y * BLOCK_SIZE);
    ctx.lineTo(canvas.width, y * BLOCK_SIZE);
    ctx.stroke();
  }

  boardArena.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value !== 0) drawBlock(ctx, x, y, value);
    });
  });

  if (activePlayer && activePlayer.matrix) {
    if (ghostEnabled) {
      const ghost = getGhostPosition();
      ghost.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) drawBlock(ctx, x + ghost.pos.x, y + ghost.pos.y, value, true);
        });
      });
    }

    activePlayer.matrix.forEach((row, y) => {
      row.forEach((value, x) => {
        if (value !== 0) drawBlock(ctx, x + activePlayer.pos.x, y + activePlayer.pos.y, value);
      });
    });
  }
}

function draw() {
  renderBoard(context, arena, player);
  drawParticles(context);
}

/* 6. 입력 제어 */
const keys = {
  ArrowLeft: { pressed: false, timer: 0 },
  ArrowRight: { pressed: false, timer: 0 },
  ArrowDown: { pressed: false, timer: 0 }
};

const DAS = 130;
const ARR = 35;
const SOFT_DROP_RATE = 35;

function handleInput(deltaTime) {
  if (isPaused) return;

  ['ArrowLeft', 'ArrowRight'].forEach(key => {
    const k = keys[key];
    if (k.pressed) {
      k.timer += deltaTime;
      if (k.timer > DAS) {
        if ((k.timer - DAS) % ARR < deltaTime) {
          playerMove(key === 'ArrowLeft' ? -1 : 1);
        }
      }
    }
  });

  const down = keys['ArrowDown'];
  if (down.pressed) {
    down.timer += deltaTime;
    if (down.timer >= SOFT_DROP_RATE) {
      playerDrop();
      down.timer = 0;
    }
  }
}

window.addEventListener('keydown', event => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(event.code)) {
    event.preventDefault();
  }

  if (event.code === 'KeyP' || event.code === 'Escape') {
    togglePause();
    return;
  }

  if (event.repeat || !player.isPlaying || isPaused) return;

  if (event.code === 'ArrowLeft') {
    keys.ArrowLeft.pressed = true;
    keys.ArrowLeft.timer = 0;
    playerMove(-1);
  } else if (event.code === 'ArrowRight') {
    keys.ArrowRight.pressed = true;
    keys.ArrowRight.timer = 0;
    playerMove(1);
  } else if (event.code === 'ArrowDown') {
    keys.ArrowDown.pressed = true;
    keys.ArrowDown.timer = 0;
    playerDrop();
  } else if (event.code === 'ArrowUp') {
    playerRotate(1);
  } else if (event.code === 'Space') {
    playerHardDrop();
  }
});

window.addEventListener('keyup', event => {
  if (keys[event.code]) {
    keys[event.code].pressed = false;
    keys[event.code].timer = 0;
  }
});

let isKeypadActive = false;
function autoDetectMobileTouch() {
  const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || (window.innerWidth <= 768);
  if (isTouchDevice) {
    setKeypadState(true);
  }
}

function setKeypadState(active) {
  isKeypadActive = active;
  const panel = document.getElementById('touch-bottom-panel');
  const btn = document.getElementById('btn-keypad-toggle');
  if (isKeypadActive) {
    panel.classList.add('active');
    btn.classList.add('on');
    btn.innerText = '🎮 패드';
  } else {
    panel.classList.remove('active');
    btn.classList.remove('on');
    btn.innerText = '🎮 패드';
  }
  updateResponsiveLayout();
}

function toggleVirtualKeypad() {
  setKeypadState(!isKeypadActive);
}

function setupTouchButton(btnId, action) {
  const el = document.getElementById(btnId);
  if (!el) return;

  const startAction = (e) => {
    e.preventDefault();
    e.stopPropagation();
    el.classList.add('touched');
    if (!player.isPlaying || isPaused) return;

    if (action === 'left') {
      keys.ArrowLeft.pressed = true;
      keys.ArrowLeft.timer = 0;
      playerMove(-1);
    } else if (action === 'right') {
      keys.ArrowRight.pressed = true;
      keys.ArrowRight.timer = 0;
      playerMove(1);
    } else if (action === 'down') {
      keys.ArrowDown.pressed = true;
      keys.ArrowDown.timer = 0;
      playerDrop();
    } else if (action === 'rot') {
      playerRotate(1);
    } else if (action === 'hard') {
      playerHardDrop();
    }
  };

  const stopAction = (e) => {
    e.preventDefault();
    e.stopPropagation();
    el.classList.remove('touched');
    if (action === 'left') keys.ArrowLeft.pressed = false;
    if (action === 'right') keys.ArrowRight.pressed = false;
    if (action === 'down') keys.ArrowDown.pressed = false;
  };

  el.addEventListener('touchstart', startAction, { passive: false });
  el.addEventListener('touchend', stopAction, { passive: false });
  el.addEventListener('touchcancel', stopAction, { passive: false });

  el.addEventListener('mousedown', startAction);
  el.addEventListener('mouseup', stopAction);
  el.addEventListener('mouseleave', stopAction);
}

setupTouchButton('v-left', 'left');
setupTouchButton('v-right', 'right');
setupTouchButton('v-down', 'down');
setupTouchButton('v-up', 'rot');
setupTouchButton('v-drop', 'hard');

/* 7. 메인 루프 */
let dropCounter = 0;
let dropInterval = 800;
let lastTime = 0;

function update(time = 0) {
  const deltaTime = time - lastTime;
  lastTime = time;

  if (player.isPlaying && !isPaused) {
    handleInput(deltaTime);
    updateParticles();

    dropCounter += deltaTime;
    if (dropCounter > dropInterval) {
      playerDrop();
    }

    if (isGrounded()) {
      lockTimer += deltaTime;
      if (lockTimer >= LOCK_DELAY) {
        lockPiece();
      }
    } else {
      lockTimer = 0;
    }
  }

  draw();
  requestAnimationFrame(update);
}

/* 8. 초기화 실행 */
applyBoardSize('standard');
resetGameBoard(1);
autoDetectMobileTouch();
update();
</script>
