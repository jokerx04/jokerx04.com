<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>테트리스</title>
  <!-- PeerJS (WebRTC P2P) & MQTT (공용 룸 리스트 실시간 탐색) CDN -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at center, #150d2a 0%, #080511 100%);
      --text-main: #f8fafc;
      --text-sub: #a78bfa;
      --text-accent: #00f5ff;
      --panel-bg: rgba(22, 16, 43, 0.85);
      --panel-border: rgba(217, 70, 239, 0.35);
      --panel-shadow: rgba(168, 85, 247, 0.25);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --board-border-grad: linear-gradient(135deg, #00f5ff, #d946ef, #ff0055);
      --board-shadow: rgba(0, 245, 255, 0.3);
      --btn-bg: #2b1b54;
      --btn-border: #00f5ff;
      --btn-text: #00f5ff;
      --btn-active-bg: #d946ef;
      --score-color: #00f5ff;
      --lines-color: #00ff66;
      --level-color: #ffe600;
      
      --psp-btn-bg: rgba(255, 255, 255, 0.18);
      --psp-btn-border: rgba(0, 245, 255, 0.6);
      --psp-btn-active: rgba(0, 245, 255, 0.7);
      --psp-btn-glow: rgba(0, 245, 255, 0.3);
    }

    body[data-theme="retro"] {
      --bg-gradient: radial-gradient(circle at center, #1a0033 0%, #000000 100%);
      --text-main: #ffffff;
      --text-sub: #ffcc00;
      --text-accent: #00ffff;
      --panel-bg: rgba(10, 0, 20, 0.9);
      --panel-border: rgba(255, 0, 85, 0.5);
      --panel-shadow: rgba(255, 0, 85, 0.3);
      --card-bg: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 204, 0, 0.2);
      --board-border-grad: linear-gradient(135deg, #ff0055, #ffcc00, #00ccff);
      --board-shadow: rgba(255, 0, 85, 0.35);
      --btn-bg: #330033;
      --btn-border: #ff0055;
      --btn-text: #ff0055;
      --btn-active-bg: #ffcc00;
      --score-color: #ff0055;
      --lines-color: #ffcc00;
      --level-color: #00ccff;
      --psp-btn-border: rgba(255, 0, 85, 0.6);
      --psp-btn-active: rgba(255, 0, 85, 0.8);
      --psp-btn-glow: rgba(255, 0, 85, 0.4);
    }

    body[data-theme="pastel"] {
      --bg-gradient: radial-gradient(circle at center, #2e263d 0%, #15121e 100%);
      --text-main: #f1f5f9;
      --text-sub: #c084fc;
      --text-accent: #67e8f9;
      --panel-bg: rgba(35, 28, 48, 0.85);
      --panel-border: rgba(192, 132, 252, 0.4);
      --panel-shadow: rgba(192, 132, 252, 0.2);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --board-border-grad: linear-gradient(135deg, #67e8f9, #c084fc, #fda4af);
      --board-shadow: rgba(103, 232, 249, 0.25);
      --btn-bg: #2d2440;
      --btn-border: #67e8f9;
      --btn-text: #67e8f9;
      --btn-active-bg: #c084fc;
      --score-color: #67e8f9;
      --lines-color: #86efac;
      --level-color: #fde047;
      --psp-btn-border: rgba(103, 232, 249, 0.6);
      --psp-btn-active: rgba(192, 132, 252, 0.8);
      --psp-btn-glow: rgba(103, 232, 249, 0.4);
    }

    body[data-theme="mono"] {
      --bg-gradient: radial-gradient(circle at center, #24242e 0%, #0f0f13 100%);
      --text-main: #ffffff;
      --text-sub: #94a3b8;
      --text-accent: #e2e8f0;
      --panel-bg: rgba(24, 24, 30, 0.9);
      --panel-border: rgba(255, 255, 255, 0.25);
      --panel-shadow: rgba(0, 0, 0, 0.5);
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --board-border-grad: linear-gradient(135deg, #ffffff, #94a3b8, #475569);
      --board-shadow: rgba(255, 255, 255, 0.15);
      --btn-bg: #22222a;
      --btn-border: #94a3b8;
      --btn-text: #ffffff;
      --btn-active-bg: #64748b;
      --score-color: #ffffff;
      --lines-color: #cbd5e1;
      --level-color: #e2e8f0;
      --psp-btn-border: rgba(255, 255, 255, 0.5);
      --psp-btn-active: rgba(255, 255, 255, 0.7);
      --psp-btn-glow: rgba(255, 255, 255, 0.2);
    }

    body[data-theme="emerald"] {
      --bg-gradient: radial-gradient(circle at center, #06241b 0%, #020d0a 100%);
      --text-main: #ecfdf5;
      --text-sub: #6ee7b7;
      --text-accent: #10b981;
      --panel-bg: rgba(6, 36, 27, 0.88);
      --panel-border: rgba(16, 185, 129, 0.4);
      --panel-shadow: rgba(16, 185, 129, 0.25);
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(16, 185, 129, 0.15);
      --board-border-grad: linear-gradient(135deg, #34d399, #06b6d4, #84cc16);
      --board-shadow: rgba(16, 185, 129, 0.3);
      --btn-bg: #0b382b;
      --btn-border: #34d399;
      --btn-text: #34d399;
      --btn-active-bg: #10b981;
      --score-color: #34d399;
      --lines-color: #6ee7b7;
      --level-color: #bef264;
      --psp-btn-border: rgba(52, 211, 153, 0.6);
      --psp-btn-active: rgba(16, 185, 129, 0.8);
      --psp-btn-glow: rgba(16, 185, 129, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: manipulation;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
      padding: max(6px, env(safe-area-inset-top, 6px)) 6px max(6px, env(safe-area-inset-bottom, 6px)) 6px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .top-mode-nav {
      display: flex;
      gap: 6px;
      margin-bottom: 5px;
      z-index: 30;
    }
    .mode-tab-btn {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      color: var(--text-sub);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 10.5px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
    }
    .mode-tab-btn.active {
      background: var(--btn-bg);
      border-color: var(--text-accent);
      color: var(--text-accent);
      box-shadow: 0 0 8px var(--panel-shadow);
    }

    .main-app-container {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: center;
      gap: 6px;
      margin: auto 0;
      width: 100%;
      height: calc(100% - 35px);
      max-height: 100%;
    }

    .game-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: max-width 0.15s ease-out;
    }

    .top-controls {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      gap: 3px;
      margin-bottom: 2px;
    }

    .top-theme-box {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(0, 0, 0, 0.4);
      padding: 3px 4px;
      border-radius: 5px;
      border: 1px solid var(--card-border);
      font-size: 8.5px;
      font-weight: 800;
      color: var(--text-main);
      flex: 1.5;
      justify-content: center;
      height: 100%;
      white-space: nowrap;
    }
    
    .top-theme-box select {
      background: var(--btn-bg);
      color: var(--text-accent);
      border: 1px solid var(--panel-border);
      padding: 2px 2px;
      border-radius: 3px;
      font-size: 8.5px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
      width: auto;
      flex-grow: 1;
      text-align: center;
    }

    .top-controls .btn {
      flex: 1;
      padding: 4px 2px;
      font-size: 8.5px;
      height: 100%;
    }

    .canvas-container {
      position: relative;
      border-radius: 10px;
      padding: 2.5px;
      background: var(--board-border-grad);
      box-shadow: 0 0 14px var(--board-shadow);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      width: 100%;
    }
    canvas#tetris {
      background-color: #06030e;
      border-radius: 7px;
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    .game-overlay {
      display: flex;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(6, 3, 14, 0.94);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 7px;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
      z-index: 25;
      padding: 8px;
      width: 100%;
      overflow-y: auto;
    }
    .overlay-text {
      font-size: 13.5px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-align: center;
    }
    .overlay-text.lose { color: #ff0055; text-shadow: 0 0 10px #ff0055; }
    .overlay-text.win { color: #00ff66; text-shadow: 0 0 10px #00ff66; }
    
    .start-setup-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 96%;
      max-width: 235px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      padding: 6px 8px;
      border-radius: 6px;
    }
    .start-setup-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9.5px;
      color: var(--text-main);
      width: 100%;
      white-space: nowrap;
    }
    .start-setup-row span {
      flex: 1;
      text-align: left;
      font-weight: 600;
    }
    .start-setup-row select, .start-setup-row input {
      flex: 1.3;
      max-width: 115px;
      font-size: 9.5px;
      padding: 2px 4px;
      background: var(--btn-bg);
      color: var(--text-accent);
      border: 1px solid var(--panel-border);
      border-radius: 3px;
      font-weight: 700;
      outline: none;
      text-align: center;
    }

    /* 실시간 방 목록 컨테이너 */
    .room-list-scroll {
      list-style: none;
      width: 100%;
      max-height: 110px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin: 4px 0;
      padding-right: 2px;
    }
    .room-list-scroll::-webkit-scrollbar { width: 3px; }
    .room-list-scroll::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 3px; }

    .room-item-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid var(--card-border);
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 9px;
      transition: all 0.15s;
    }
    .room-item-card:hover { border-color: var(--text-accent); }
    .room-badge {
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 7.5px;
      font-weight: 800;
    }
    .badge-wait { background: #238636; color: #fff; }
    .badge-play { background: #d29922; color: #000; }

    .score-submit-box {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 90%;
      max-width: 200px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      padding: 8px 10px;
      border-radius: 6px;
    }
    .score-submit-box input {
      width: 100%;
      padding: 4px 6px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 4px;
      color: #fff;
      font-size: 11px;
      outline: none;
      text-align: center;
      margin-bottom: 2px;
    }

    .touch-bottom-panel {
      display: none;
      width: 100%;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px;
      background: var(--panel-bg);
      border-radius: 10px;
      border: 1px solid var(--panel-border);
      z-index: 20;
      touch-action: none;
      box-shadow: 0 0 10px var(--panel-shadow);
    }
    .touch-bottom-panel.active { display: flex; }

    .dpad-box {
      display: grid;
      grid-template-columns: repeat(3, 34px);
      grid-template-rows: repeat(2, 30px);
      gap: 3px;
      justify-items: center;
      align-items: center;
    }
    .t-btn {
      width: 34px;
      height: 30px;
      background: var(--psp-btn-bg);
      border: 1.5px solid var(--psp-btn-border);
      border-radius: 8px;
      color: var(--text-accent);
      font-size: 13px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: inset 0 0 6px var(--psp-btn-glow), 0 2px 6px rgba(0, 0, 0, 0.4);
      transition: all 0.08s ease-out;
    }
    .t-btn:active, .t-btn.touched {
      background: var(--psp-btn-active) !important;
      border-color: #ffffff !important;
      color: #080511 !important;
      transform: scale(0.90);
      box-shadow: 0 0 12px var(--text-accent), inset 0 0 8px rgba(255, 255, 255, 0.8) !important;
    }
    #v-up    { grid-column: 2; grid-row: 1; }
    #v-left  { grid-column: 1; grid-row: 2; }
    #v-down  { grid-column: 2; grid-row: 2; }
    #v-right { grid-column: 3; grid-row: 2; }

    .action-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .act-btn-drop {
      width: 52px;
      height: 52px;
      background: var(--psp-btn-bg);
      border: 2px solid var(--psp-btn-border);
      border-radius: 50%;
      color: var(--text-accent);
      font-size: 8px;
      font-weight: 900;
      white-space: nowrap;
      letter-spacing: -0.3px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: inset 0 0 8px var(--psp-btn-glow), 0 2px 8px rgba(0, 0, 0, 0.4);
      transition: all 0.08s ease-out;
    }
    .act-btn-drop span {
      font-size: 14px;
      line-height: 1;
      margin-bottom: 1px;
      filter: drop-shadow(0 0 3px var(--text-accent));
    }
    .act-btn-drop:active, .act-btn-drop.touched {
      background: var(--psp-btn-active) !important;
      border-color: #ffffff !important;
      color: #080511 !important;
      transform: scale(0.90);
      box-shadow: 0 0 16px var(--text-accent), inset 0 0 10px rgba(255, 255, 255, 0.8) !important;
    }

    .side-settings-bar {
      display: flex;
      flex-direction: column;
      gap: 5px;
      width: 82px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 5px 4px;
      box-shadow: 0 0 10px var(--panel-shadow);
      z-index: 20;
      height: 100%;
      overflow-y: auto;
    }

    .side-stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 3px 2px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-align: center;
    }
    .side-stat-row {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .side-stat-label {
      font-size: 7.5px;
      font-weight: 800;
      color: var(--text-sub);
      line-height: 1;
    }
    .side-stat-value {
      font-size: 11.5px;
      font-weight: 900;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .side-next-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 3px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    #next-canvas {
      display: block;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .side-opponents-box {
      display: none;
      flex-direction: column;
      gap: 4px;
      width: 100%;
    }
    .opp-card {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      border-radius: 4px;
      padding: 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    .opp-card.ko {
      opacity: 0.35;
      filter: grayscale(1);
    }
    .opp-name {
      font-size: 7px;
      font-weight: 800;
      color: #fff;
      max-width: 70px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .opp-canvas {
      background: #000;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 2px;
    }

    .btn {
      padding: 5px 2px;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid var(--btn-border);
      border-radius: 5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 9px;
      white-space: nowrap;
      text-align: center;
      width: 100%;
    }
    .btn:hover {
      background: var(--btn-text);
      color: #080511;
      box-shadow: 0 0 6px var(--btn-text);
    }
    .btn-toggle {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--text-sub);
      color: var(--text-sub);
    }
    .btn-toggle.on {
      background: rgba(0, 245, 255, 0.2);
      border-color: var(--text-accent);
      color: var(--text-accent);
      box-shadow: 0 0 6px var(--panel-shadow);
    }
    .btn-pause {
      background: rgba(255, 230, 0, 0.15);
      border: 1px solid #ffe600;
      color: #ffe600;
    }
    .btn-ready {
      background: #ffe600;
      color: #080511;
      border: none;
      font-size: 11px;
      padding: 6px 12px;
      box-shadow: 0 0 10px rgba(255, 230, 0, 0.5);
      border-radius: 6px;
      font-weight: 800;
      cursor: pointer;
      width: 100%;
    }

    .side-leaderboard-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px 2px;
      border-radius: 5px;
      border: 1px solid var(--card-border);
      width: 100%;
      flex-grow: 1;
    }
    .side-leaderboard-box .title {
      font-size: 8px;
      font-weight: 800;
      color: var(--level-color);
      margin-bottom: 3px;
      text-shadow: 0 0 4px var(--level-color);
    }
    .leaderboard-list {
      list-style: none;
      width: 100%;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    
    .leaderboard-item {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      font-size: 7.5px;
      padding: 3px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
      line-height: 1;
    }
    .leaderboard-item .rank { 
      color: var(--text-sub); 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
      width: 100%;
      max-width: 68px; 
    }
    .leaderboard-item .score { 
      font-weight: 800; 
      color: var(--text-main); 
      align-self: flex-end; 
      font-size: 8px;
    }

    .controls-modal-backdrop {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(8, 5, 17, 0.82);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .controls-modal-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 14px;
      max-width: 260px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 20px var(--panel-shadow);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .controls-modal-card h3 {
      font-size: 13px;
      color: var(--text-accent);
    }
    .modal-guide-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-align: left;

/* =========================================================
   0. CheddaBoards 글로벌 랭킹 (REST API)
========================================================= */
const CHEDDA_API_KEY = 'cb_blog-tetris_4097310434';

function fetchLeaderboard() {
  const list = document.getElementById('leaderboard-list');
  list.innerHTML = '<li class="leaderboard-item" style="justify-content:center; color:#888;">로딩 중...</li>';
  
  const targetUrl = `https://api.cheddaboards.com/leaderboard?_t=${Date.now()}`;

  fetch(targetUrl, {
    method: 'GET',
    headers: {
      'X-API-Key': CHEDDA_API_KEY,
      'Accept': 'application/json'
    }
  })
  .then(response => {
    if (!response.ok) throw new Error("조회 API 연동 오류");
    return response.json();
  })
  .then(res => {
    let entries = [];
    if (res.data && res.data.leaderboard) entries = res.data.leaderboard;
    else if (res.entries) entries = res.entries;
    else if (Array.isArray(res)) entries = res;

    if (!entries || entries.length === 0) {
      list.innerHTML = '<li class="leaderboard-item" style="justify-content:center; color:#888;">기록 없음</li>';
      return;
    }

    list.innerHTML = entries.slice(0, 10).map((s, idx) => `
      <li class="leaderboard-item">
        <span class="rank">${idx + 1}. ${s.nickname || s.player || s.playerId || '익명'}</span>
        <span class="score">${parseInt(s.score).toLocaleString()}</span>
      </li>
    `).join('');
  })
  .catch(err => {
    console.error("CheddaBoards Load Error:", err);
    list.innerHTML = '<li class="leaderboard-item" style="justify-content:center; color:#ff0055;">네트워크 오류</li>';
  });
}

function submitScore() {
  const input = document.getElementById('username-input');
  let name = input.value.trim();
  
  if (!name) { 
    alert("영문 이름을 입력해주세요."); 
    return; 
  }
  
  const btn = document.getElementById('btn-submit-score');
  btn.innerText = "등록 중...";
  btn.disabled = true;

  const targetUrl = `https://api.cheddaboards.com/scores`;

  fetch(targetUrl, {
    method: 'POST',
    headers: {
      'X-API-Key': CHEDDA_API_KEY,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      playerId: name,
      nickname: name,
      score: player.score,
      streak: 0
    })
  })
  .then(response => {
    if(!response.ok) throw new Error("등록 API 연동 오류: " + response.status);
    
    document.getElementById('username-input').value = "";
    document.getElementById('score-submit-box').style.display = 'none';
    
    if (currentAppMode === 'single') {
      document.getElementById('single-setup-box').style.display = 'flex';
    } else {
      document.getElementById('multi-lobby-box').style.display = 'flex';
    }
    
    btn.innerText = "등록하기";
    btn.disabled = false;
    fetchLeaderboard();
  })
  .catch(err => {
    console.error("CheddaBoards Submit Error:", err);
    alert("등록 실패. 네트워크를 확인하세요.");
    btn.innerText = "등록하기";
    btn.disabled = false;
  });
}

function cancelSubmitScore() {
  document.getElementById('username-input').value = "";

    resetGameBoard(parseInt(document.getElementById('single-start-level').value, 10));
  } else {
    overlay.style.display = 'flex';
    document.getElementById('overlay-msg').innerText = "실시간 온라인 대전 로비";
    document.getElementById('overlay-msg').style.color = "var(--level-color)";
    singleBox.style.display = 'none';
    multiBox.style.display = 'flex';
    document.getElementById('room-create-section').style.display = 'flex';
    document.getElementById('room-waiting-info').style.display = 'none';
    
    initPeerAndLobbyDiscovery();
  }
  updateResponsiveLayout();
}

function openControlsModal() {
  document.getElementById('controls-modal').style.display = 'flex';
}

function closeControlsModal(e) {
  if (!e || e.target === document.getElementById('controls-modal') || e.target.tagName === 'BUTTON') {
    document.getElementById('controls-modal').style.display = 'none';
  }
}

function updateResponsiveLayout() {
  const gameSection = document.getElementById('game-section');
  const dpad = document.getElementById('touch-bottom-panel');
  const topControls = document.getElementById('top-controls');
  const isDpadVisible = dpad && dpad.classList.contains('active');

  const vh = window.innerHeight;
  const vw = window.innerWidth;

  const topNavH = 32;
  const topControlsH = topControls ? topControls.offsetHeight : 0;
  const dpadH = isDpadVisible ? 68 : 0;
  const marginH = 16;

  const reservedHeight = topNavH + topControlsH + dpadH + marginH;
  const availableCanvasHeight = Math.max(160, vh - reservedHeight);

  const boardRatio = BOARD_CONFIG.fixedWidth / BOARD_CONFIG.fixedHeight;
  let targetWidth = availableCanvasHeight * boardRatio;

  const maxAllowedWidth = Math.min(vw - 96, 380);
  const minAllowedWidth = 160;

  targetWidth = Math.min(Math.max(targetWidth, minAllowedWidth), maxAllowedWidth);
  gameSection.style.maxWidth = `${Math.round(targetWidth)}px`;
}

window.addEventListener('resize', updateResponsiveLayout);
window.addEventListener('orientationchange', updateResponsiveLayout);

function applyBoardSize(sizeKey) {
  const cfg = BOARD_SIZES[sizeKey] || BOARD_SIZES.standard;
  currentBoardSizeKey = sizeKey;
  COLS = cfg.cols;
  ROWS = cfg.rows;
  
  canvas.width = BOARD_CONFIG.fixedWidth;
  canvas.height = BOARD_CONFIG.fixedHeight;
  BLOCK_SIZE = BOARD_CONFIG.fixedWidth / COLS;

  setTimeout(updateResponsiveLayout, 0);
}

function onBoardSizeChange(sizeKey) {
  if (!player.isPlaying) {
    applyBoardSize(sizeKey);
    resetGameBoard(startLevel);
  }
}

function onStartLevelChange(lvl) {
  const parsed = parseInt(lvl, 10) || 1;
  if (!player.isPlaying) {
    startLevel = parsed;
    player.level = startLevel;
    dropInterval = Math.max(80, 800 - (player.level - 1) * 70);
    updateScore();
  }
}

function toggleGhost() {
  ghostEnabled = !ghostEnabled;
  const btn = document.getElementById('btn-ghost-toggle');
  if (ghostEnabled) {
    btn.classList.add('on');
  } else {
    btn.classList.remove('on');

}

function togglePause() {
  if (!player.isPlaying || isSpectator) return;
  isPaused = !isPaused;
  const overlay = document.getElementById('game-overlay');
  const msg = document.getElementById('overlay-msg');
  const pauseBtn = document.getElementById('btn-pause');

/* =========================================================
   3. 실시간 로비 탐색(MQTT Discovery) & WebRTC P2P 대전
========================================================= */
const MQTT_BROKER = 'wss://broker.emqx.io:8084/mqtt';
const LOBBY_TOPIC = 'tetris/global_lobby_v2';

let mqttClient = null;
let peer = null;
let myPeerId = '';
let isHost = false;
let hostConn = null;
let peerConnections = {};
let networkPeers = {};
let broadcastTimer = null;
let roomHeartbeatTimer = null;
let pendingGarbageQueue = 0;
let discoveredRooms = {}; // { roomId: { id, title, size, lvl, players, max, status, hostPeerId, lastSeen } }

function initPeerAndLobbyDiscovery() {
  // 1. PeerJS 초기화
  if (!peer || peer.destroyed) {
    const randId = 'T_' + Math.random().toString(36).substring(2, 7).toUpperCase();
    peer = new Peer(randId);

    peer.on('open', id => {
      myPeerId = id;
    });

    peer.on('connection', conn => {
      handleIncomingConnection(conn);
    });
  }

  // 2. MQTT 공용 로비 채널 연결 (방 목록 자동 발견)
  if (!mqttClient || !mqttClient.connected) {
    try {
      mqttClient = mqtt.connect(MQTT_BROKER);

      mqttClient.on('connect', () => {
        document.getElementById('lobby-status-text').innerText = "● 로비 연결됨";
        document.getElementById('lobby-status-text').style.color = "#238636";
        mqttClient.subscribe(LOBBY_TOPIC);
      });

      mqttClient.on('message', (topic, message) => {
        try {
          const data = JSON.parse(message.toString());
          handleLobbyMessage(data);
        } catch(e) {}
      });

      // 만료된 방 정리 타이머 (5초 이상 신호 없을 시 목록 제거)
      setInterval(() => {
        const now = Date.now();
        let changed = false;
        for (let rId in discoveredRooms) {
          if (now - discoveredRooms[rId].lastSeen > 6000) {
            delete discoveredRooms[rId];
            changed = true;
          }
        }
        if (changed) renderDiscoveredRoomsUI();
      }, 3000);

    } catch(e) {
      console.warn("MQTT discovery fallback");
    }
  }
}

function handleLobbyMessage(msg) {
  if (msg.type === 'ROOM_ANNOUNCE') {
    discoveredRooms[msg.roomId] = {
      id: msg.roomId,
      title: msg.title,
      size: msg.size,
      lvl: msg.lvl,
      players: msg.players,
      max: msg.max,
      status: msg.status,
      hostPeerId: msg.hostPeerId,
      lastSeen: Date.now()
    };
    renderDiscoveredRoomsUI();
  } else if (msg.type === 'ROOM_CLOSED') {
    delete discoveredRooms[msg.roomId];
    renderDiscoveredRoomsUI();
  }
}

function renderDiscoveredRoomsUI() {
  const list = document.getElementById('active-rooms-list');
  const roomKeys = Object.keys(discoveredRooms);

  if (roomKeys.length === 0) {
    list.innerHTML = `<li style="text-align:center; font-size:8px; color:#888; padding:8px 0;">개설된 방이 없습니다.</li>`;
    return;
  }

  list.innerHTML = roomKeys.map(rId => {
    const room = discoveredRooms[rId];
    const isPlaying = room.status === 'playing';
    const isFull = room.players >= room.max;
    const canJoin = !isPlaying && !isFull;

    return `
      <li class="room-item-card">
        <div>
          <div style="font-weight:800; color:#fff;">${room.title}</div>
          <div style="color:var(--text-sub); font-size:7.5px;">${room.size} | Lv.${room.lvl} | ${room.players}/${room.max}명</div>
        </div>
        <div style="display:flex; align-items:center; gap:4px;">
          <span class="room-badge ${isPlaying ? 'badge-play' : 'badge-wait'}">${isPlaying ? '진행 중' : '대기 중'}</span>
          <button class="btn" style="padding:2px 6px; font-size:8px; width:auto;" onclick="joinRoomByClick('${room.hostPeerId}', ${isPlaying || isFull})">
            ${canJoin ? '참여' : '관전'}
          </button>
        </div>
      </li>
    `;
  }).join('');
}

function hostCreateRoom() {
  if (!peer || !myPeerId) {
    initPeerAndLobbyDiscovery();
  }

  isHost = true;
  const title = document.getElementById('multi-room-title').value.trim() || '테트리스 대전';
  const sizeKey = document.getElementById('multi-board-size').value;
  const lvl = parseInt(document.getElementById('multi-start-level').value, 10);
  applyBoardSize(sizeKey);
  startLevel = lvl;

  document.getElementById('room-create-section').style.display = 'none';
  document.getElementById('room-waiting-info').style.display = 'flex';
  document.getElementById('waiting-room-title').innerText = `[${title}] 대기실`;
  updateWaitingPlayerCount();

  // 공용 로비에 내 방 브로드캐스트 시작 (2초 주기)
  if (roomHeartbeatTimer) clearInterval(roomHeartbeatTimer);
  roomHeartbeatTimer = setInterval(() => {
    broadcastRoomToLobby(title, sizeKey, lvl, 'waiting');
  }, 2000);
  broadcastRoomToLobby(title, sizeKey, lvl, 'waiting');
}

function broadcastRoomToLobby(title, size, lvl, status) {
  if (mqttClient && mqttClient.connected && isHost) {
    mqttClient.publish(LOBBY_TOPIC, JSON.stringify({
      type: 'ROOM_ANNOUNCE',
      roomId: myPeerId,
      title: title,
      size: size,
      lvl: lvl,
      players: Object.keys(peerConnections).length + 1,
      max: 6,
      status: status,
      hostPeerId: myPeerId
    }));
  }
}

function leaveWaitingRoom() {
  if (roomHeartbeatTimer) clearInterval(roomHeartbeatTimer);
  if (mqttClient && mqttClient.connected && isHost) {
    mqttClient.publish(LOBBY_TOPIC, JSON.stringify({ type: 'ROOM_CLOSED', roomId: myPeerId }));
  }
  isHost = false;
  document.getElementById('room-create-section').style.display = 'flex';
  document.getElementById('room-waiting-info').style.display = 'none';
}

function joinRoomByClick(hostPeerId, asSpectator = false) {
  if (!peer || !myPeerId) initPeerAndLobbyDiscovery();

  isHost = false;
  isSpectator = asSpectator;
  hostConn = peer.connect(hostPeerId);

  hostConn.on('open', () => {
    const myName = document.getElementById('multi-player-name').value.trim() || 'Player';
    hostConn.send({ type: 'JOIN', name: myName, asSpectator: asSpectator });
    document.getElementById('overlay-msg').innerText = asSpectator ? "관전 모드로 연결 중..." : "방 입장 완료! 대기 중...";
    document.getElementById('overlay-msg').style.color = asSpectator ? "#d29922" : "var(--text-accent)";
  });

  hostConn.on('data', data => {
    handleNetworkMessage(hostConn, data);
  });

  hostConn.on('close', () => {
    alert("방과의 연결이 종료되었습니다.");
    setAppMode('multi');
  });
}

function handleIncomingConnection(conn) {
  conn.on('open', () => {
    conn.on('data', data => {
      handleNetworkMessage(conn, data);
    });

    if (isHost) {
      peerConnections[conn.peer] = conn;
      conn.send({
        type: 'ROOM_SYNC',
        sizeKey: currentBoardSizeKey,
        startLevel: startLevel,
        isStarted: player.isPlaying,
        isSpectator: player.isPlaying || Object.keys(peerConnections).length > 6
      });
      updateWaitingPlayerCount();
      const title = document.getElementById('multi-room-title').value.trim();
      broadcastRoomToLobby(title, currentBoardSizeKey, startLevel, player.isPlaying ? 'playing' : 'waiting');
    }
  });

  conn.on('close', () => {
    delete peerConnections[conn.peer];
    delete networkPeers[conn.peer];
    updateWaitingPlayerCount();
    buildOpponentCardsUI();
  });
}

function updateWaitingPlayerCount() {
  const count = Object.keys(peerConnections).length + 1;
  const countElem = document.getElementById('display-player-count');
  if (countElem) {
    countElem.innerText = `참가자: ${count} / 6명`;
  }
}

function hostStartMatch() {
  const title = document.getElementById('multi-room-title').value.trim();
  broadcastRoomToLobby(title, currentBoardSizeKey, startLevel, 'playing');

  broadcastToAll({
    type: 'GAME_START',
    sizeKey: currentBoardSizeKey,
    startLevel: startLevel
  });

  startActualMultiGame(false);
}

function handleNetworkMessage(conn, data) {
  if (data.type === 'ROOM_SYNC') {
    applyBoardSize(data.sizeKey);
    startLevel = data.startLevel;
    if (data.isStarted) {
      isSpectator = true;
      startActualMultiGame(true);
    }
  } else if (data.type === 'JOIN') {
    networkPeers[conn.peer] = {
      name: data.name || 'User',
      board: createMatrix(COLS, ROWS),
      isAlive: true,
      isSpectator: data.asSpectator
    };
    buildOpponentCardsUI();
  } else if (data.type === 'GAME_START') {
    applyBoardSize(data.sizeKey);
    startLevel = data.startLevel;
    startActualMultiGame(isSpectator);
  } else if (data.type === 'STATE_UPDATE') {
    if (!networkPeers[conn.peer]) {
      networkPeers[conn.peer] = { name: data.name, board: data.board, isAlive: data.isAlive };
      buildOpponentCardsUI();
    } else {
      networkPeers[conn.peer].board = data.board;
      networkPeers[conn.peer].isAlive = data.isAlive;
    }
    renderPeerMiniCanvas(conn.peer);

    if (isHost) {
      for (let pId in peerConnections) {
        if (pId !== conn.peer) peerConnections[pId].send(data);
      }
    }
    checkMultiWinner();
  } else if (data.type === 'ATTACK_GARBAGE') {
    if (!isSpectator && player.isPlaying) {
      pendingGarbageQueue += data.lines;
    }
  }
}

function broadcastToAll(msg) {
  if (isHost) {
    for (let pId in peerConnections) peerConnections[pId].send(msg);
  } else if (hostConn && hostConn.open) {
    hostConn.send(msg);
  }
}

function startActualMultiGame(asSpectator = false) {
  isSpectator = asSpectator;
  document.getElementById('game-overlay').style.display = 'none';
  document.getElementById('side-opponents-box').style.display = 'flex';
  
  buildOpponentCardsUI();

  if (isSpectator) {
    player.isPlaying = false;
    document.getElementById('overlay-msg').innerText = "👁️ 실시간 관전 중";
    document.getElementById('overlay-msg').style.color = "#d29922";
  } else {
    resetGameBoard(startLevel);
    player.isPlaying = true;
    nextPiece = getRandomPiece();
    playerReset();
  }

  if (broadcastTimer) clearInterval(broadcastTimer);
  broadcastTimer = setInterval(() => {
    if (currentAppMode !== 'multi') {
      clearInterval(broadcastTimer);
      return;
    }
    broadcastToAll({
      type: 'STATE_UPDATE',
      peerId: myPeerId,
      name: document.getElementById('multi-player-name').value.trim() || 'Player',
      board: arena,
      isAlive: player.isPlaying
    });
  }, 120);
}

function buildOpponentCardsUI() {
  const container = document.getElementById('side-opponents-box');
  container.innerHTML = '';

  for (let pId in networkPeers) {
    const opp = networkPeers[pId];
    if (opp.isSpectator) continue;

    const card = document.createElement('div');
    card.className = 'opp-card' + (opp.isAlive ? '' : ' ko');
    card.id = `opp-card-${pId}`;

    const miniW = 54;
    const miniH = Math.floor(miniW * (ROWS / COLS));

    card.innerHTML = `
      <span class="opp-name">${opp.name}</span>
      <canvas id="canvas-${pId}" class="opp-canvas" width="${miniW}" height="${miniH}"></canvas>
    `;
    container.appendChild(card);
  }
}

function renderPeerMiniCanvas(pId) {
  const opp = networkPeers[pId];
  if (!opp) return;
  const canvas = document.getElementById(`canvas-${pId}`);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const miniBlockW = canvas.width / COLS;
  const miniBlockH = canvas.height / ROWS;

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const val = opp.board[r] ? opp.board[r][c] : 0;
      if (val && PALETTE[val]) {
        ctx.fillStyle = PALETTE[val].base;
        ctx.fillRect(c * miniBlockW, r * miniBlockH, miniBlockW - 0.5, miniBlockH - 0.5);
      }
    }
  }
}

function sendGarbageAttack(clearedLines) {
  let attackLines = clearedLines >= 4 ? 4 : clearedLines - 1;
  if (attackLines > 0) {
    broadcastToAll({
      type: 'ATTACK_GARBAGE',
      lines: attackLines
    });
  }
}

function receiveGarbageLines() {
  if (pendingGarbageQueue <= 0) return;
  const addCount = pendingGarbageQueue;
  pendingGarbageQueue = 0;

  for (let i = 0; i < addCount; i++) {
    arena.shift();
    const garbageRow = new Array(COLS).fill(8);
    garbageRow[Math.floor(Math.random() * COLS)] = 0;
    arena.push(garbageRow);
  }
}

function checkMultiWinner() {
  if (isSpectator || !player.isPlaying) return;
  
  let otherAlive = 0;
  for (let pId in networkPeers) {
    if (networkPeers[pId].isAlive && !networkPeers[pId].isSpectator) otherAlive++;
  }

  if (Object.keys(networkPeers).length > 0 && otherAlive === 0) {
    triggerVictory();
  }
}

function triggerVictory() {
  player.isPlaying = false;
  const overlay = document.getElementById('game-overlay');
  const msg = document.getElementById('overlay-msg');
  const scoreSubmitBox = document.getElementById('score-submit-box');
  const multiBox = document.getElementById('multi-lobby-box');

  overlay.style.display = 'flex';
  msg.innerText = "🏆 최종 승리 (VICTORY)!";
  msg.className = "overlay-text win";

  document.getElementById('score-submit-title').innerText = "🏆 대전 우승자 랭킹 등록";
  multiBox.style.display = 'none';
  scoreSubmitBox.style.display = 'flex';
  document.getElementById('username-input').focus();
}

/* =========================================================
   4. 테트리스 코어 게임 엔진
========================================================= */
const canvas = document.getElementById('tetris');
const context = canvas.getContext('2d');
const nextCanvas = document.getElementById('next-canvas');
const nextContext = nextCanvas.getContext('2d');

const scoreElement = document.getElementById('score');
const linesElement = document.getElementById('lines');
const levelElement = document.getElementById('level');

let nextPiece = null;

function createPiece(type) {
  switch (type) {
    case 'T': return [[0, 1, 0], [1, 1, 1], [0, 0, 0]];
    case 'I': return [[0, 2, 0, 0], [0, 2, 0, 0], [0, 2, 0, 0], [0, 2, 0, 0]];
    case 'S': return [[0, 3, 3], [3, 3, 0], [0, 0, 0]];
    case 'Z': return [[4, 4, 0], [0, 4, 4], [0, 0, 0]];
    case 'L': return [[0, 5, 0], [0, 5, 0], [0, 5, 5]];
    case 'O': return [[6, 6], [6, 6]];
    case 'J': return [[0, 7, 0], [0, 7, 0], [7, 7, 0]];
  }
}

function getRandomPiece() {
  const pieces = 'ILJOTSZ';
  return createPiece(pieces[Math.floor(pieces.length * Math.random())]);
}

function drawNextPiece() {
  if (!nextContext) return;
  nextContext.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
  if (!nextPiece) return;

  const size = 7;
  const offsetX = (nextCanvas.width - nextPiece[0].length * size) / 2;
  const offsetY = (nextCanvas.height - nextPiece.length * size) / 2;

  nextPiece.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value !== 0) {
        const item = PALETTE[value];
        if (item) {
          nextContext.fillStyle = item.base;
          nextContext.fillRect(offsetX + x * size + 0.5, offsetY + y * size + 0.5, size - 1, size - 1);
          nextContext.strokeStyle = item.light;
          nextContext.lineWidth = 1;
          nextContext.strokeRect(offsetX + x * size + 0.5, offsetY + y * size + 0.5, size - 1, size - 1);
        }
      }
    });
  });
}

function createMatrix(w, h) {
  const matrix = [];
  while (h--) matrix.push(new Array(w).fill(0));
  return matrix;
}

let arena = createMatrix(COLS, ROWS);

const player = {
  pos: { x: 0, y: 0 },
  matrix: null,
  score: 0,
  lines: 0,
  level: 1,
  isPlaying: false
};

function collide(arenaTarget, piece) {
  const [m, o] = [piece.matrix, piece.pos];
  for (let y = 0; y < m.length; ++y) {
    for (let x = 0; x < m[y].length; ++x) {
      if (m[y][x] !== 0 &&
          (arenaTarget[y + o.y] && arenaTarget[y + o.y][x + o.x]) !== 0) {
        return true;
      }
    }
  }
  return false;
}

function merge(arenaTarget, p) {
  p.matrix.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value !== 0) arenaTarget[y + p.pos.y][x + p.pos.x] = value;
    });
  });
}

function rotate(matrix, dir) {
  for (let y = 0; y < matrix.length; ++y) {
    for (let x = 0; x < y; ++x) {
      [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
    }
  }
  if (dir > 0) matrix.forEach(row => row.reverse());
  else matrix.reverse();
}

function playerRotate(dir) {
  if (!player.isPlaying || isPaused) return;
  const pos = player.pos.x;
  let offset = 1;
  rotate(player.matrix, dir);
  while (collide(arena, player)) {
    player.pos.x += offset;
    offset = -(offset + (offset > 0 ? 1 : -1));
    if (offset > player.matrix[0].length) {
      rotate(player.matrix, -dir);
      player.pos.x = pos;
      return;
    }
  }
  resetLockDelay();
}

function playerMove(dir) {
  if (!player.isPlaying || isPaused) return;
  player.pos.x += dir;
  if (collide(arena, player)) {
    player.pos.x -= dir;
  } else {
    resetLockDelay();
  }
}

let lockTimer = 0;
const LOCK_DELAY = 450;
let lockResets = 0;
const MAX_LOCK_RESETS = 12;

function isGrounded() {
  player.pos.y++;
  const grounded = collide(arena, player);
  player.pos.y--;
  return grounded;
}

function resetLockDelay() {
  if (isGrounded() && lockResets < MAX_LOCK_RESETS) {
    lockTimer = 0;
    lockResets++;
  }
}

function lockPiece() {
  merge(arena, player);
  arenaSweep();
  receiveGarbageLines();
  playerReset();
  lockTimer = 0;
  lockResets = 0;
}

function playerDrop() {
  if (!player.isPlaying || isPaused) return false;
  player.pos.y++;
  if (collide(arena, player)) {
    player.pos.y--;
    return false;
  }
  player.score += 1;
  updateScore();
  dropCounter = 0;
  return true;
}

function playerHardDrop() {
  if (!player.isPlaying || isPaused) return;
  let dropDistance = 0;
  while (!collide(arena, player)) {
    player.pos.y++;
    dropDistance++;
  }
  player.pos.y--;
  dropDistance--;
  player.score += dropDistance * 2;
  updateScore();
  lockPiece();
}

function getGhostPosition() {
  const ghost = {
    pos: { x: player.pos.x, y: player.pos.y },
    matrix: player.matrix
  };
  while (!collide(arena, ghost)) {
    ghost.pos.y++;
  }
  ghost.pos.y--;
  return ghost;
}

function arenaSweep() {
  let rowCount = 0;
  outer: for (let y = arena.length - 1; y >= 0; --y) {
    for (let x = 0; x < arena[y].length; ++x) {
      if (arena[y][x] === 0) continue outer;
    }
    const rowColors = arena[y].map(val => (PALETTE[val] ? PALETTE[val].base : '#fff'));
    spawnParticles(y, rowColors);

    const row = arena.splice(y, 1)[0].fill(0);
    arena.unshift(row);
    ++y;
    rowCount++;
  }

  if (rowCount > 0) {
    const lineScores = [0, 100, 300, 500, 800];
    player.score += (lineScores[rowCount] || 1000) * player.level;
    player.lines += rowCount;
    player.level = startLevel + Math.floor(player.lines / 10);
    dropInterval = Math.max(80, 800 - (player.level - 1) * 70);
    updateScore();

    if (currentAppMode === 'multi') {
      sendGarbageAttack(rowCount);
    }
  }
}

function playerReset() {
  player.matrix = nextPiece || getRandomPiece();
  nextPiece = getRandomPiece();
  drawNextPiece();

  player.pos.y = 0;
  player.pos.x = Math.floor(COLS / 2) - Math.floor(player.matrix[0].length / 2);

  if (collide(arena, player)) {
    triggerGameOver();
  }
}

function triggerGameOver() {
  player.isPlaying = false;
  isPaused = false;
  
  const overlay = document.getElementById('game-overlay');
  const msg = document.getElementById('overlay-msg');
  const setupBox = document.getElementById('single-setup-box');
  const multiBox = document.getElementById('multi-lobby-box');
  const scoreSubmitBox = document.getElementById('score-submit-box');
  const pauseBtn = document.getElementById('btn-pause');

  overlay.style.display = 'flex';
  msg.innerText = "게임 종료";
  msg.className = "overlay-text lose";
  pauseBtn.innerText = "⏸️ 정지";

  if (currentAppMode === 'multi') {
    broadcastToAll({
      type: 'STATE_UPDATE',
      peerId: myPeerId,
      name: document.getElementById('multi-player-name').value.trim() || 'Player',
      board: arena,
      isAlive: false
    });
  }

  if (player.score > 0) {
    setupBox.style.display = 'none';
    multiBox.style.display = 'none';
    document.getElementById('score-submit-title').innerText = "🏆 글로벌 랭킹 등록";
    scoreSubmitBox.style.display = 'flex';
    document.getElementById('username-input').focus();
  } else {
    if (currentAppMode === 'single') {
      setupBox.style.display = 'flex';
      document.getElementById('overlay-btn').innerText = '다시 시작';
    } else {
      multiBox.style.display = 'flex';
    }
    scoreSubmitBox.style.display = 'none';
  }
}

function updateScore() {
  scoreElement.innerText = player.score.toLocaleString();
  linesElement.innerText = player.lines;
  levelElement.innerText = player.level;
}

function startGame() {
  if (isPaused) {
    togglePause();
    return;
  }
  startLevel = parseInt(document.getElementById('single-start-level').value, 10) || 1;
  const selectedSize = document.getElementById('single-board-size').value;
  applyBoardSize(selectedSize);

  document.getElementById('game-overlay').style.display = 'none';
  document.getElementById('side-opponents-box').style.display = 'none';
  resetGameBoard(startLevel);
  player.isPlaying = true;
  nextPiece = getRandomPiece();
  playerReset();
}

function resetGameBoard(lvl = 1) {
  arena = createMatrix(COLS, ROWS);
  player.score = 0;
  player.lines = 0;
  player.level = lvl;
  dropInterval = Math.max(80, 800 - (player.level - 1) * 70);
  updateScore();
}

/* =========================================================
   5. 파티클 이펙트
========================================================= */
const particles = [];
function spawnParticles(y, colors) {
  for (let x = 0; x < COLS; x++) {
    for (let i = 0; i < 2; i++) {
      particles.push({
        x: (x + 0.5) * BLOCK_SIZE,
        y: (y + 0.5) * BLOCK_SIZE,
        vx: (Math.random() - 0.5) * 5,
        vy: (Math.random() - 0.5) * 5 - 1.5,
        size: Math.random() * 3 + 2,
        color: colors[Math.floor(Math.random() * colors.length)],
        alpha: 1,
        decay: Math.random() * 0.02 + 0.02
      });
    }
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.alpha -= p.decay;
    if (p.alpha <= 0) particles.splice(i, 1);
  }
}

function drawParticles(ctx) {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 6;
    ctx.fillRect(p.x, p.y, p.size, p.size);
    ctx.restore();
  });
}

/* =========================================================
   6. 보드 렌더링
========================================================= */
function drawBlock(ctx, x, y, paletteIdx, isGhost = false) {
  const px = x * BLOCK_SIZE;
  const py = y * BLOCK_SIZE;
  const item = PALETTE[paletteIdx];
  if (!item) return;

  if (isGhost) {
    ctx.save();
    ctx.strokeStyle = item.glow;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(px + 1.5, py + 1.5, BLOCK_SIZE - 3, BLOCK_SIZE - 3);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
    ctx.fillRect(px + 1.5, py + 1.5, BLOCK_SIZE - 3, BLOCK_SIZE - 3);
    ctx.restore();
    return;
  }

  ctx.save();
  const grad = ctx.createLinearGradient(px, py, px + BLOCK_SIZE, py + BLOCK_SIZE);
  grad.addColorStop(0, item.light);
  grad.addColorStop(0.3, item.base);
  grad.addColorStop(1, '#05020a');

  ctx.fillStyle = grad;
  ctx.fillRect(px + 1, py + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);

  ctx.strokeStyle = item.light;
  ctx.lineWidth = 1;
  ctx.strokeRect(px + 2, py + 2, BLOCK_SIZE - 4, BLOCK_SIZE - 4);
  ctx.restore();
}

function renderBoard(ctx, boardArena, activePlayer = null) {
  ctx.fillStyle = '#06030e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
  ctx.lineWidth = 1;
  for (let x = 0; x < COLS; x++) {
    ctx.beginPath();
    ctx.moveTo(x * BLOCK_SIZE, 0);
    ctx.lineTo(x * BLOCK_SIZE, canvas.height);
    ctx.stroke();
  }
  for (let y = 0; y < ROWS; y++) {
    ctx.beginPath();
    ctx.moveTo(0, y * BLOCK_SIZE);
    ctx.lineTo(canvas.width, y * BLOCK_SIZE);
    ctx.stroke();
  }

  boardArena.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value !== 0) drawBlock(ctx, x, y, value);
    });
  });

  if (activePlayer && activePlayer.matrix) {
    if (ghostEnabled) {
      const ghost = getGhostPosition();
      ghost.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) drawBlock(ctx, x + ghost.pos.x, y + ghost.pos.y, value, true);
        });
      });
    }

    activePlayer.matrix.forEach((row, y) => {
      row.forEach((value, x) => {
        if (value !== 0) drawBlock(ctx, x + activePlayer.pos.x, y + activePlayer.pos.y, value);
      });
    });
  }
}

function draw() {
  renderBoard(context, arena, player);
  drawParticles(context);
}

/* =========================================================
   7. DAS / ARR 입력 엔진 (밀림 방지 정밀 보정)
========================================================= */
const keys = {
  ArrowLeft: { pressed: false, timer: 0, lastStep: 0 },
  ArrowRight: { pressed: false, timer: 0, lastStep: 0 },
  ArrowDown: { pressed: false, timer: 0 }
};

const DAS = 150;
const ARR = 40;
const SOFT_DROP_RATE = 35;

function handleInput(deltaTime) {
  if (isPaused || !player.isPlaying) return;

  ['ArrowLeft', 'ArrowRight'].forEach(key => {
    const k = keys[key];
    if (k.pressed) {
      k.timer += deltaTime;
      if (k.timer >= DAS) {
        const steps = Math.floor((k.timer - DAS) / ARR);
        if (steps > k.lastStep) {
          const deltaSteps = steps - k.lastStep;
          for (let i = 0; i < deltaSteps; i++) {
            playerMove(key === 'ArrowLeft' ? -1 : 1);
          }
          k.lastStep = steps;
        }
      }
    }
  });

  const down = keys['ArrowDown'];
  if (down.pressed) {
    down.timer += deltaTime;
    if (down.timer >= SOFT_DROP_RATE) {
      playerDrop();
      down.timer = 0;
    }
  }
}

window.addEventListener('keydown', event => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(event.code)) {
    event.preventDefault();
  }

  if (event.code === 'KeyP' || event.code === 'Escape') {
    togglePause();
    return;
  }

  if (event.repeat || !player.isPlaying || isPaused) return;

  if (event.code === 'ArrowLeft') {
    keys.ArrowLeft.pressed = true;
    keys.ArrowLeft.timer = 0;
    keys.ArrowLeft.lastStep = 0;
    playerMove(-1);
  } else if (event.code === 'ArrowRight') {
    keys.ArrowRight.pressed = true;
    keys.ArrowRight.timer = 0;
    keys.ArrowRight.lastStep = 0;
    playerMove(1);
  } else if (event.code === 'ArrowDown') {
    keys.ArrowDown.pressed = true;
    keys.ArrowDown.timer = 0;
    playerDrop();
  } else if (event.code === 'ArrowUp') {
    playerRotate(1);
  } else if (event.code === 'Space') {
    playerHardDrop();
  }
});

window.addEventListener('keyup', event => {
  if (keys[event.code]) {
    keys[event.code].pressed = false;
    keys[event.code].timer = 0;
    keys[event.code].lastStep = 0;
  }
});

let isKeypadActive = false;
function autoDetectMobileTouch() {
  const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || (window.innerWidth <= 768);
  if (isTouchDevice) {
    setKeypadState(true);
  }
}

function setKeypadState(active) {
  isKeypadActive = active;
  const panel = document.getElementById('touch-bottom-panel');
  const btn = document.getElementById('btn-keypad-toggle');
  if (isKeypadActive) {
    panel.classList.add('active');
    btn.classList.add('on');
  } else {
    panel.classList.remove('active');
    btn.classList.remove('on');
  }
  updateResponsiveLayout();
}

function toggleVirtualKeypad() {
  setKeypadState(!isKeypadActive);
}

function setupTouchButton(btnId, action) {
  const el = document.getElementById(btnId);
  if (!el) return;

  const startAction = (e) => {
    e.preventDefault();
    e.stopPropagation();
    el.classList.add('touched');
    if (!player.isPlaying || isPaused) return;

    if (action === 'left') {
      keys.ArrowLeft.pressed = true;
      keys.ArrowLeft.timer = 0;
      keys.ArrowLeft.lastStep = 0;
      playerMove(-1);
    } else if (action === 'right') {
      keys.ArrowRight.pressed = true;
      keys.ArrowRight.timer = 0;
      keys.ArrowRight.lastStep = 0;
      playerMove(1);
    } else if (action === 'down') {
      keys.ArrowDown.pressed = true;
      keys.ArrowDown.timer = 0;
      playerDrop();
    } else if (action === 'rot') {
      playerRotate(1);
    } else if (action === 'hard') {
      playerHardDrop();
    }
  };

  const stopAction = (e) => {
    e.preventDefault();
    e.stopPropagation();
    el.classList.remove('touched');
    if (action === 'left') {
      keys.ArrowLeft.pressed = false;
      keys.ArrowLeft.timer = 0;
      keys.ArrowLeft.lastStep = 0;
    }
    if (action === 'right') {
      keys.ArrowRight.pressed = false;
      keys.ArrowRight.timer = 0;
      keys.ArrowRight.lastStep = 0;
    }
    if (action === 'down') keys.ArrowDown.pressed = false;
  };

  el.addEventListener('touchstart', startAction, { passive: false });
  el.addEventListener('touchend', stopAction, { passive: false });
  el.addEventListener('touchcancel', stopAction, { passive: false });

  el.addEventListener('mousedown', startAction);
  el.addEventListener('mouseup', stopAction);
  el.addEventListener('mouseleave', stopAction);
}

setupTouchButton('v-left', 'left');
setupTouchButton('v-right', 'right');
setupTouchButton('v-down', 'down');
setupTouchButton('v-up', 'rot');
setupTouchButton('v-drop', 'hard');

/* =========================================================
   8. 메인 루프 및 초기화
========================================================= */
let dropCounter = 0;
let dropInterval = 800;
let lastTime = 0;

function update(time = 0) {
  const deltaTime = time - lastTime;
  lastTime = time;

  if (player.isPlaying && !isPaused) {
    handleInput(deltaTime);
    updateParticles();

    dropCounter += deltaTime;
    if (dropCounter > dropInterval) {
      playerDrop();
    }

    if (isGrounded()) {
      lockTimer += deltaTime;
      if (lockTimer >= LOCK_DELAY) {
        lockPiece();
      }
    } else {
      lockTimer = 0;
    }
  }

  draw();
  requestAnimationFrame(update);
}

fetchLeaderboard();
applyBoardSize('standard');
resetGameBoard(1);
autoDetectMobileTouch();
setTimeout(updateResponsiveLayout, 100);
update();
</script>
