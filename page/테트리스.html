<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>테트리스</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at center, #150d2a 0%, #080511 100%);
      --text-main: #f8fafc;
      --text-sub: #a78bfa;
      --text-accent: #00f5ff;
      --panel-bg: rgba(22, 16, 43, 0.85);
      --panel-border: rgba(217, 70, 239, 0.35);
      --panel-shadow: rgba(168, 85, 247, 0.25);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --board-border-grad: linear-gradient(135deg, #00f5ff, #d946ef, #ff0055);
      --board-shadow: rgba(0, 245, 255, 0.3);
      --btn-bg: #2b1b54;
      --btn-border: #00f5ff;
      --btn-text: #00f5ff;
      --btn-active-bg: #d946ef;
      --score-color: #00f5ff;
      --lines-color: #00ff66;
      --level-color: #ffe600;
      
      /* PPSSPP 스타일 반투명 버튼 */
      --psp-btn-bg: rgba(255, 255, 255, 0.18);
      --psp-btn-border: rgba(0, 245, 255, 0.6);
      --psp-btn-active: rgba(0, 245, 255, 0.7);
      --psp-btn-glow: rgba(0, 245, 255, 0.3);
    }

    body[data-theme="retro"] {
      --bg-gradient: radial-gradient(circle at center, #1a0033 0%, #000000 100%);
      --text-main: #ffffff;
      --text-sub: #ffcc00;
      --text-accent: #00ffff;
      --panel-bg: rgba(10, 0, 20, 0.9);
      --panel-border: rgba(255, 0, 85, 0.5);
      --panel-shadow: rgba(255, 0, 85, 0.3);
      --card-bg: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 204, 0, 0.2);
      --board-border-grad: linear-gradient(135deg, #ff0055, #ffcc00, #00ccff);
      --board-shadow: rgba(255, 0, 85, 0.35);
      --btn-bg: #330033;
      --btn-border: #ff0055;
      --btn-text: #ff0055;
      --btn-active-bg: #ffcc00;
      --score-color: #ff0055;
      --lines-color: #ffcc00;
      --level-color: #00ccff;
      --psp-btn-border: rgba(255, 0, 85, 0.6);
      --psp-btn-active: rgba(255, 0, 85, 0.8);
      --psp-btn-glow: rgba(255, 0, 85, 0.4);
    }

    body[data-theme="pastel"] {
      --bg-gradient: radial-gradient(circle at center, #2e263d 0%, #15121e 100%);
      --text-main: #f1f5f9;
      --text-sub: #c084fc;
      --text-accent: #67e8f9;
      --panel-bg: rgba(35, 28, 48, 0.85);
      --panel-border: rgba(192, 132, 252, 0.4);
      --panel-shadow: rgba(192, 132, 252, 0.2);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --board-border-grad: linear-gradient(135deg, #67e8f9, #c084fc, #fda4af);
      --board-shadow: rgba(103, 232, 249, 0.25);
      --btn-bg: #2d2440;
      --btn-border: #67e8f9;
      --btn-text: #67e8f9;
      --btn-active-bg: #c084fc;
      --score-color: #67e8f9;
      --lines-color: #86efac;
      --level-color: #fde047;
      --psp-btn-border: rgba(103, 232, 249, 0.6);
      --psp-btn-active: rgba(192, 132, 252, 0.8);
      --psp-btn-glow: rgba(103, 232, 249, 0.4);
    }

    body[data-theme="mono"] {
      --bg-gradient: radial-gradient(circle at center, #24242e 0%, #0f0f13 100%);
      --text-main: #ffffff;
      --text-sub: #94a3b8;
      --text-accent: #e2e8f0;
      --panel-bg: rgba(24, 24, 30, 0.9);
      --panel-border: rgba(255, 255, 255, 0.25);
      --panel-shadow: rgba(0, 0, 0, 0.5);
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --board-border-grad: linear-gradient(135deg, #ffffff, #94a3b8, #475569);
      --board-shadow: rgba(255, 255, 255, 0.15);
      --btn-bg: #22222a;
      --btn-border: #94a3b8;
      --btn-text: #ffffff;
      --btn-active-bg: #64748b;
      --score-color: #ffffff;
      --lines-color: #cbd5e1;
      --level-color: #e2e8f0;
      --psp-btn-border: rgba(255, 255, 255, 0.5);
      --psp-btn-active: rgba(255, 255, 255, 0.7);
      --psp-btn-glow: rgba(255, 255, 255, 0.2);
    }

    body[data-theme="emerald"] {
      --bg-gradient: radial-gradient(circle at center, #06241b 0%, #020d0a 100%);
      --text-main: #ecfdf5;
      --text-sub: #6ee7b7;
      --text-accent: #10b981;
      --panel-bg: rgba(6, 36, 27, 0.88);
      --panel-border: rgba(16, 185, 129, 0.4);
      --panel-shadow: rgba(16, 185, 129, 0.25);
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(16, 185, 129, 0.15);
      --board-border-grad: linear-gradient(135deg, #34d399, #06b6d4, #84cc16);
      --board-shadow: rgba(16, 185, 129, 0.3);
      --btn-bg: #0b382b;
      --btn-border: #34d399;
      --btn-text: #34d399;
      --btn-active-bg: #10b981;
      --score-color: #34d399;
      --lines-color: #6ee7b7;
      --level-color: #bef264;
      --psp-btn-border: rgba(52, 211, 153, 0.6);
      --psp-btn-active: rgba(16, 185, 129, 0.8);
      --psp-btn-glow: rgba(16, 185, 129, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: manipulation;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
      padding: max(8px, env(safe-area-inset-top, 8px)) 8px max(8px, env(safe-area-inset-bottom, 8px)) 8px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* 좌측 게임 보드 + 우측 설정 사이드바 (2단) */
    .main-app-container {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: center;
      gap: 6px;
      margin: auto 0;
      width: 100%;
    }

    .game-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: max-width 0.15s ease-out;
    }

    .canvas-container {
      position: relative;
      border-radius: 10px;
      padding: 2.5px;
      background: var(--board-border-grad);
      box-shadow: 0 0 14px var(--board-shadow);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    canvas#tetris {
      background-color: #06030e;
      border-radius: 7px;
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    /* 게임 시작/종료 오버레이 */
    .game-overlay {
      display: flex;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(6, 3, 14, 0.92);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 7px;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
      z-index: 25;
      padding: 6px;
      width: 100%;
    }
    .overlay-text {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-align: center;
    }
    .overlay-text.lose { color: #ff0055; text-shadow: 0 0 10px #ff0055; }
    
    .start-setup-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 90%;
      max-width: 200px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      padding: 5px 7px;
      border-radius: 6px;
    }
    .start-setup-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9.5px;
      color: var(--text-main);
      width: 100%;
      white-space: nowrap;
    }
    .start-setup-row span {
      flex: 1;
      text-align: left;
      font-weight: 600;
    }
    .start-setup-row select {
      flex: 1.2;
      max-width: 100px;
      font-size: 9.5px;
      padding: 1px 3px;
      background: var(--btn-bg);
      color: var(--text-accent);
      border: 1px solid var(--panel-border);
      border-radius: 3px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
    }

    /* 랭킹 점수 등록 박스 */
    .score-submit-box {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 90%;
      max-width: 200px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      padding: 8px 10px;
      border-radius: 6px;
    }
    .score-submit-box input {
      width: 100%;
      padding: 4px 6px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 4px;
      color: #fff;
      font-size: 11px;
      outline: none;
      text-align: center;
      margin-bottom: 2px;
    }
    .score-submit-box input::placeholder { color: #aaa; }

    /* PPSSPP 스타일 터치 패드 */
    .touch-bottom-panel {
      display: none;
      width: 100%;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px;
      background: var(--panel-bg);
      border-radius: 10px;
      border: 1px solid var(--panel-border);
      z-index: 20;
      touch-action: none;
      box-shadow: 0 0 10px var(--panel-shadow);
    }
    .touch-bottom-panel.active {
      display: flex;
    }

    .dpad-box {
      display: grid;
      grid-template-columns: repeat(3, 34px);
      grid-template-rows: repeat(2, 30px);
      gap: 3px;
      justify-items: center;
      align-items: center;
    }
    .t-btn {
      width: 34px;
      height: 30px;
      background: var(--psp-btn-bg);
      border: 1.5px solid var(--psp-btn-border);
      border-radius: 8px;
      color: var(--text-accent);
      font-size: 13px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: inset 0 0 6px var(--psp-btn-glow), 0 2px 6px rgba(0, 0, 0, 0.4);
      transition: all 0.08s ease-out;
    }
    .t-btn:active, .t-btn.touched {
      background: var(--psp-btn-active) !important;
      border-color: #ffffff !important;
      color: #080511 !important;
      transform: scale(0.90);
      box-shadow: 0 0 12px var(--text-accent), inset 0 0 8px rgba(255, 255, 255, 0.8) !important;
    }
    #v-up    { grid-column: 2; grid-row: 1; }
    #v-left  { grid-column: 1; grid-row: 2; }
    #v-down  { grid-column: 2; grid-row: 2; }
    #v-right { grid-column: 3; grid-row: 2; }

    .action-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .act-btn-drop {
      width: 52px;
      height: 52px;
      background: var(--psp-btn-bg);
      border: 2px solid var(--psp-btn-border);
      border-radius: 50%;
      color: var(--text-accent);
      font-size: 8px;
      font-weight: 900;
      white-space: nowrap;
      letter-spacing: -0.3px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: inset 0 0 8px var(--psp-btn-glow), 0 2px 8px rgba(0, 0, 0, 0.4);
      transition: all 0.08s ease-out;
    }
    .act-btn-drop span {
      font-size: 14px;
      line-height: 1;
      margin-bottom: 1px;
      filter: drop-shadow(0 0 3px var(--text-accent));
    }
    .act-btn-drop:active, .act-btn-drop.touched {
      background: var(--psp-btn-active) !important;
      border-color: #ffffff !important;
      color: #080511 !important;
      transform: scale(0.90);
      box-shadow: 0 0 16px var(--text-accent), inset 0 0 10px rgba(255, 255, 255, 0.8) !important;
    }

    /* 우측 슬림 사이드바 */
    .side-settings-bar {
      display: flex;
      flex-direction: column;
      gap: 5px;
      width: 68px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 5px 4px;
      box-shadow: 0 0 10px var(--panel-shadow);
      z-index: 20;
    }

    .side-stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 3px 2px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-align: center;
    }
    .side-stat-row {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .side-stat-label {
      font-size: 7.5px;
      font-weight: 800;
      color: var(--text-sub);
      line-height: 1;
    }
    .side-stat-value {
      font-size: 11.5px;
      font-weight: 900;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .side-next-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 3px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    #next-canvas {
      display: block;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .btn {
      padding: 5px 2px;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid var(--btn-border);
      border-radius: 5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 9.5px;
      white-space: nowrap;
      text-align: center;
      width: 100%;
    }
    .btn:hover {
      background: var(--btn-text);
      color: #080511;
      box-shadow: 0 0 6px var(--btn-text);
    }
    .btn-toggle {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--text-sub);
      color: var(--text-sub);
    }
    .btn-toggle.on {
      background: rgba(0, 245, 255, 0.2);
      border-color: var(--text-accent);
      color: var(--text-accent);
      box-shadow: 0 0 6px var(--panel-shadow);
    }
    .btn-pause {
      background: rgba(255, 230, 0, 0.15);
      border: 1px solid #ffe600;
      color: #ffe600;
    }
    .btn-ready {
      background: #ffe600;
      color: #080511;
      border: none;
      font-size: 12px;
      padding: 6px 14px;
      box-shadow: 0 0 10px rgba(255, 230, 0, 0.5);
      border-radius: 6px;
      font-weight: 800;
      cursor: pointer;
      width: 100%;
    }

    .side-theme-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      background: rgba(0, 0, 0, 0.4);
      padding: 3px 2px;
      border-radius: 5px;
      border: 1px solid var(--card-border);
      font-size: 8.5px;
      color: var(--text-main);
      width: 100%;
    }
    .side-theme-box select {
      background: var(--btn-bg);
      color: var(--text-accent);
      border: 1px solid var(--panel-border);
      padding: 2px 1px;
      border-radius: 3px;
      font-size: 8.5px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
      width: 100%;
      text-align: center;
    }

    /* 명예의 전당 (저장된 랭킹) */
    .side-leaderboard-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px 2px;
      border-radius: 5px;
      border: 1px solid var(--card-border);
      width: 100%;
      flex-grow: 1;
    }
    .side-leaderboard-box .title {
      font-size: 8px;
      font-weight: 800;
      color: var(--level-color);
      margin-bottom: 3px;
      text-shadow: 0 0 4px var(--level-color);
    }
    .leaderboard-list {
      list-style: none;
      width: 100%;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 8px;
      padding: 2px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 2px;
      line-height: 1;
    }
    .leaderboard-item .rank { 
      color: var(--text-sub); 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
      max-width: 32px;
    }
    .leaderboard-item .score { 
      font-weight: 700; 
      color: var(--text-main); 
    }

    /* 조작키 설명 팝업 모달 */
    .controls-modal-backdrop {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(8, 5, 17, 0.82);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .controls-modal-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 14px;
      max-width: 260px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 20px var(--panel-shadow);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .controls-modal-card h3 {
      font-size: 13px;
      color: var(--text-accent);
    }
    .modal-guide-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-align: left;
      font-size: 10px;
      color: var(--text-main);
      background: var(--card-bg);
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      line-height: 1.4;
    }
    .key-badge {
      display: inline-block;
      padding: 1px 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 3px;
      color: var(--text-accent);
      font-weight: 600;
      font-size: 9px;
    }
  </style>
</head>
<body>

  <div class="main-app-container" id="main-container">
    
    <!-- 1단 (좌측): 게임 캔버스 영역 및 패드 -->
    <div class="game-section" id="game-section">
      
      <div class="canvas-container" id="canvas-wrapper">
        <canvas id="tetris" width="270" height="540"></canvas>

        <div id="game-overlay" class="game-overlay">
          <div id="overlay-msg" class="overlay-text" style="color: var(--text-accent);">준비 완료</div>
          
          <!-- 게임 설정 및 시작 -->
          <div id="single-setup-box" class="start-setup-box">
            <div class="start-setup-row">
              <span>보드 크기</span>
              <select id="single-board-size" onchange="onBoardSizeChange(this.value)">
                <option value="small">소형 (8×16)</option>
                <option value="standard" selected>표준 (10×20)</option>
                <option value="wide">와이드 (12×20)</option>
                <option value="large">대형 (12×24)</option>
                <option value="giant">특대형 (14×26)</option>
              </select>
            </div>
            <div class="start-setup-row">
              <span>시작 단계</span>
              <select id="single-start-level" onchange="onStartLevelChange(this.value)">
                <option value="1" selected>1단계</option>
                <option value="2">2단계</option>
                <option value="3">3단계</option>
                <option value="4">4단계</option>
                <option value="5">5단계</option>
                <option value="6">6단계</option>
                <option value="7">7단계</option>
                <option value="8">8단계</option>
                <option value="9">9단계</option>
                <option value="10">10단계</option>
              </select>
            </div>
            <button id="overlay-btn" class="btn-ready" onclick="startGame()">게임 시작</button>
          </div>

          <!-- 점수 달성 시 랭킹 등록 영역 (기본 숨김) -->
          <div id="score-submit-box" class="score-submit-box">
            <span style="font-size: 10px; color: var(--text-sub); margin-bottom: 2px;">🏆 글로벌 랭킹 등록</span>
            <input type="text" id="username-input" placeholder="영문 이름 입력 (최대 8자)" maxlength="8" oninput="this.value=this.value.replace(/[^a-zA-Z0-9]/g,'');">
            <div style="display: flex; gap: 4px; width: 100%;">

async function fetchLeaderboard() {
  const list = document.getElementById('leaderboard-list');
  
  try {
    // 브라우저 자체 CORS 차단을 막기 위해 프록시 사용 (allorigins)
    const targetUrl = `https://dreamlo.com/lb/${DREAMLO_PUBLIC_KEY}/json?_=${Date.now()}`;
    const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
    
    const res = await fetch(proxyUrl);
    const data = await res.json();
    let entries = [];
    
    if (data.dreamlo && data.dreamlo.leaderboard && data.dreamlo.leaderboard.entry) {
      const raw = data.dreamlo.leaderboard.entry;
      entries = Array.isArray(raw) ? raw : [raw];
    }
    
    if (entries.length === 0) {
      list.innerHTML = '<li class="leaderboard-item" style="justify-content:center; color:#888;">기록 없음</li>';
      return;
    }

    list.innerHTML = entries.slice(0, 5).map((s, idx) => `
      <li class="leaderboard-item">
        <span class="rank">${idx + 1}. ${s.name}</span>
        <span class="score">${parseInt(s.score).toLocaleString()}</span>
      </li>
    `).join('');
  } catch (err) {
    console.error("Dreamlo 로드 에러", err);
    list.innerHTML = '<li class="leaderboard-item" style="justify-content:center; color:#ff0055;">연결 실패</li>';
  }
}

/* 2. 모달 제어 및 반응형 엔진 */
let ghostEnabled = true;
let startLevel = 1;

function openControlsModal() {

}

  if (!e || e.target === document.getElementById('controls-modal') || e.target.tagName === 'BUTTON') {

function updateResponsiveLayout() {
  const gameSection = document.getElementById('game-section');
  const dpad = document.getElementById('touch-bottom-panel');
  const isDpadVisible = dpad && dpad.classList.contains('active');

  const vh = window.innerHeight;
  const vw = window.innerWidth;

  const dpadH = isDpadVisible ? 68 : 0;
  const marginH = 16;

  const reservedHeight = dpadH + marginH;
  const availableCanvasHeight = Math.max(160, vh - reservedHeight);

  const boardRatio = BOARD_CONFIG.fixedWidth / BOARD_CONFIG.fixedHeight;
  let targetWidth = availableCanvasHeight * boardRatio;

  // 우측 사이드바(68px + 6px gap = 74px)를 고려한 가로폭 제한
  const maxAllowedWidth = Math.min(vw - 84, 380);
  const minAllowedWidth = 160;

  targetWidth = Math.min(Math.max(targetWidth, minAllowedWidth), maxAllowedWidth);
  gameSection.style.maxWidth = `${Math.round(targetWidth)}px`;
}

window.addEventListener('resize', updateResponsiveLayout);
window.addEventListener('orientationchange', updateResponsiveLayout);

function applyBoardSize(sizeKey) {
  const cfg = BOARD_SIZES[sizeKey] || BOARD_SIZES.standard;
  currentBoardSizeKey = sizeKey;
  COLS = cfg.cols;
  ROWS = cfg.rows;
  
  canvas.width = BOARD_CONFIG.fixedWidth;
  canvas.height = BOARD_CONFIG.fixedHeight;
  BLOCK_SIZE = BOARD_CONFIG.fixedWidth / COLS;

  updateResponsiveLayout();
}

function onBoardSizeChange(sizeKey) {

    applyBoardSize(sizeKey);
    resetGameBoard(startLevel);
  }

    player.level = startLevel;

/* 3. 게임 엔진 & NEXT 블록 렌더링 */
const canvas = document.getElementById('tetris');
const context = canvas.getContext('2d');
const nextCanvas = document.getElementById('next-canvas');
const nextContext = nextCanvas.getContext('2d');

const scoreElement = document.getElementById('score');
const linesElement = document.getElementById('lines');
const levelElement = document.getElementById('level');

let nextPiece = null;

function createPiece(type) {
  switch (type) {
    case 'T': return [[0, 1, 0], [1, 1, 1], [0, 0, 0]];
    case 'I': return [[0, 2, 0, 0], [0, 2, 0, 0], [0, 2, 0, 0], [0, 2, 0, 0]];
    case 'S': return [[0, 3, 3], [3, 3, 0], [0, 0, 0]];
    case 'Z': return [[4, 4, 0], [0, 4, 4], [0, 0, 0]];
    case 'L': return [[0, 5, 0], [0, 5, 0], [0, 5, 5]];
    case 'O': return [[6, 6], [6, 6]];
    case 'J': return [[0, 7, 0], [0, 7, 0], [7, 7, 0]];
  }
}

function getRandomPiece() {
  const pieces = 'ILJOTSZ';
  return createPiece(pieces[Math.floor(pieces.length * Math.random())]);
}

function drawNextPiece() {
  if (!nextContext) return;
  nextContext.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
  if (!nextPiece) return;

  const size = 7;
  const offsetX = (nextCanvas.width - nextPiece[0].length * size) / 2;
  const offsetY = (nextCanvas.height - nextPiece.length * size) / 2;

  nextPiece.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value !== 0) {
        const item = PALETTE[value];
        if (item) {
          nextContext.fillStyle = item.base;
          nextContext.fillRect(offsetX + x * size + 0.5, offsetY + y * size + 0.5, size - 1, size - 1);
          nextContext.strokeStyle = item.light;
          nextContext.lineWidth = 1;
          nextContext.strokeRect(offsetX + x * size + 0.5, offsetY + y * size + 0.5, size - 1, size - 1);
        }
      }
    });
  });
}

function createMatrix(w, h) {
  const matrix = [];
  while (h--) matrix.push(new Array(w).fill(0));
  return matrix;
}

let arena = createMatrix(COLS, ROWS);

const player = {
  pos: { x: 0, y: 0 },
  matrix: null,
  score: 0,
  lines: 0,
  level: 1,
  isPlaying: false
};

function collide(arenaTarget, piece) {
  const [m, o] = [piece.matrix, piece.pos];
  for (let y = 0; y < m.length; ++y) {
    for (let x = 0; x < m[y].length; ++x) {
      if (m[y][x] !== 0 &&
          (arenaTarget[y + o.y] && arenaTarget[y + o.y][x + o.x]) !== 0) {
        return true;
      }
    }
  }
  return false;
}

function merge(arenaTarget, p) {
  p.matrix.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value !== 0) arenaTarget[y + p.pos.y][x + p.pos.x] = value;
    });
  });
}

function rotate(matrix, dir) {
  for (let y = 0; y < matrix.length; ++y) {
    for (let x = 0; x < y; ++x) {
      [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
    }
  }
  if (dir > 0) matrix.forEach(row => row.reverse());
  else matrix.reverse();
}

function playerRotate(dir) {
  if (!player.isPlaying || isPaused) return;
  const pos = player.pos.x;
  let offset = 1;
  rotate(player.matrix, dir);
  while (collide(arena, player)) {
    player.pos.x += offset;
    offset = -(offset + (offset > 0 ? 1 : -1));
    if (offset > player.matrix[0].length) {
      rotate(player.matrix, -dir);
      player.pos.x = pos;
      return;
    }
  }
  resetLockDelay();
}

function playerMove(dir) {
  if (!player.isPlaying || isPaused) return;
  player.pos.x += dir;
  if (collide(arena, player)) {
    player.pos.x -= dir;
  } else {
    resetLockDelay();
  }
}

let lockTimer = 0;
const LOCK_DELAY = 450;
let lockResets = 0;
const MAX_LOCK_RESETS = 12;

function isGrounded() {
  player.pos.y++;
  const grounded = collide(arena, player);
  player.pos.y--;
  return grounded;
}

function resetLockDelay() {
  if (isGrounded() && lockResets < MAX_LOCK_RESETS) {
    lockTimer = 0;
    lockResets++;
  }
}

function lockPiece() {
  merge(arena, player);
  arenaSweep();
  playerReset();
  lockTimer = 0;
  lockResets = 0;
}

function playerDrop() {
  if (!player.isPlaying || isPaused) return false;
  player.pos.y++;
  if (collide(arena, player)) {
    player.pos.y--;
    return false;
  }
  player.score += 1;
  updateScore();
  dropCounter = 0;
  return true;
}

function playerHardDrop() {
  if (!player.isPlaying || isPaused) return;
  let dropDistance = 0;
  while (!collide(arena, player)) {
    player.pos.y++;
    dropDistance++;
  }
  player.pos.y--;
  dropDistance--;
  player.score += dropDistance * 2;
  updateScore();
  lockPiece();
}

function getGhostPosition() {
  const ghost = {
    pos: { x: player.pos.x, y: player.pos.y },
    matrix: player.matrix
  };
  while (!collide(arena, ghost)) {
    ghost.pos.y++;
  }
  ghost.pos.y--;
  return ghost;
}

function arenaSweep() {
  let rowCount = 0;
  outer: for (let y = arena.length - 1; y >= 0; --y) {
    for (let x = 0; x < arena[y].length; ++x) {
      if (arena[y][x] === 0) continue outer;
    }
    const rowColors = arena[y].map(val => (PALETTE[val] ? PALETTE[val].base : '#fff'));
    spawnParticles(y, rowColors);

    const row = arena.splice(y, 1)[0].fill(0);
    arena.unshift(row);
    ++y;
    rowCount++;
  }

  if (rowCount > 0) {
    const lineScores = [0, 100, 300, 500, 800];
    player.score += (lineScores[rowCount] || 1000) * player.level;
    player.lines += rowCount;
    player.level = startLevel + Math.floor(player.lines / 10);
    dropInterval = Math.max(80, 800 - (player.level - 1) * 70);
    updateScore();
  }
}

function playerReset() {
  player.matrix = nextPiece || getRandomPiece();
  nextPiece = getRandomPiece();
  drawNextPiece();

  player.pos.y = 0;
  player.pos.x = Math.floor(COLS / 2) - Math.floor(player.matrix[0].length / 2);

  if (collide(arena, player)) {
    triggerGameOver();
  }
}

function triggerGameOver() {
  player.isPlaying = false;
  isPaused = false;
  
  const overlay = document.getElementById('game-overlay');
  const msg = document.getElementById('overlay-msg');
  const setupBox = document.getElementById('single-setup-box');
  const scoreSubmitBox = document.getElementById('score-submit-box');
  const pauseBtn = document.getElementById('btn-pause');

  overlay.style.display = 'flex';
  msg.innerText = "게임 종료";
  msg.className = "overlay-text lose";
  pauseBtn.innerText = "⏸️ 정지";

  if (player.score > 0) {
    setupBox.style.display = 'none';
    scoreSubmitBox.style.display = 'flex';
    document.getElementById('username-input').focus();
  } else {
    setupBox.style.display = 'flex';
    scoreSubmitBox.style.display = 'none';
    document.getElementById('overlay-btn').innerText = '다시 시작';
  }
}

function updateScore() {
  scoreElement.innerText = player.score.toLocaleString();
  linesElement.innerText = player.lines;
  levelElement.innerText = player.level;
}

function startGame() {
  if (isPaused) {
    togglePause();
    return;
  }
  startLevel = parseInt(document.getElementById('single-start-level').value, 10) || 1;
  const selectedSize = document.getElementById('single-board-size').value;
  applyBoardSize(selectedSize);

  document.getElementById('game-overlay').style.display = 'none';
  resetGameBoard(startLevel);
  player.isPlaying = true;
  nextPiece = getRandomPiece();
  playerReset();
}

function resetGameBoard(lvl = 1) {
  arena = createMatrix(COLS, ROWS);
  player.score = 0;
  player.lines = 0;
  player.level = lvl;
  dropInterval = Math.max(80, 800 - (player.level - 1) * 70);
  updateScore();
}

/* 4. 파티클 이펙트 */
const particles = [];
function spawnParticles(y, colors) {
  for (let x = 0; x < COLS; x++) {
    for (let i = 0; i < 2; i++) {
      particles.push({
        x: (x + 0.5) * BLOCK_SIZE,
        y: (y + 0.5) * BLOCK_SIZE,
        vx: (Math.random() - 0.5) * 5,
        vy: (Math.random() - 0.5) * 5 - 1.5,
        size: Math.random() * 3 + 2,
        color: colors[Math.floor(Math.random() * colors.length)],
        alpha: 1,
        decay: Math.random() * 0.02 + 0.02
      });
    }
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.alpha -= p.decay;
    if (p.alpha <= 0) particles.splice(i, 1);
  }
}

function drawParticles(ctx) {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 6;
    ctx.fillRect(p.x, p.y, p.size, p.size);
    ctx.restore();
  });
}

/* 5. 보드 렌더링 */
function drawBlock(ctx, x, y, paletteIdx, isGhost = false) {
  const px = x * BLOCK_SIZE;
  const py = y * BLOCK_SIZE;
  const item = PALETTE[paletteIdx];
  if (!item) return;

  if (isGhost) {
    ctx.save();
    ctx.strokeStyle = item.glow;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(px + 1.5, py + 1.5, BLOCK_SIZE - 3, BLOCK_SIZE - 3);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
    ctx.fillRect(px + 1.5, py + 1.5, BLOCK_SIZE - 3, BLOCK_SIZE - 3);
    ctx.restore();
    return;
  }

  ctx.save();
  const grad = ctx.createLinearGradient(px, py, px + BLOCK_SIZE, py + BLOCK_SIZE);
  grad.addColorStop(0, item.light);
  grad.addColorStop(0.3, item.base);
  grad.addColorStop(1, '#05020a');

  ctx.fillStyle = grad;
  ctx.fillRect(px + 1, py + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);

  ctx.strokeStyle = item.light;
  ctx.lineWidth = 1;
  ctx.strokeRect(px + 2, py + 2, BLOCK_SIZE - 4, BLOCK_SIZE - 4);
  ctx.restore();
}

function renderBoard(ctx, boardArena, activePlayer = null) {
  ctx.fillStyle = '#06030e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
  ctx.lineWidth = 1;
  for (let x = 0; x < COLS; x++) {
    ctx.beginPath();
    ctx.moveTo(x * BLOCK_SIZE, 0);
    ctx.lineTo(x * BLOCK_SIZE, canvas.height);
    ctx.stroke();
  }
  for (let y = 0; y < ROWS; y++) {
    ctx.beginPath();
    ctx.moveTo(0, y * BLOCK_SIZE);
    ctx.lineTo(canvas.width, y * BLOCK_SIZE);
    ctx.stroke();
  }

  boardArena.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value !== 0) drawBlock(ctx, x, y, value);
    });
  });

  if (activePlayer && activePlayer.matrix) {
    if (ghostEnabled) {
      const ghost = getGhostPosition();
      ghost.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) drawBlock(ctx, x + ghost.pos.x, y + ghost.pos.y, value, true);
        });
      });
    }

    activePlayer.matrix.forEach((row, y) => {
      row.forEach((value, x) => {
        if (value !== 0) drawBlock(ctx, x + activePlayer.pos.x, y + activePlayer.pos.y, value);
      });
    });
  }
}

function draw() {
  renderBoard(context, arena, player);
  drawParticles(context);
}

/* 6. 입력 제어 */
const keys = {
  ArrowLeft: { pressed: false, timer: 0 },
  ArrowRight: { pressed: false, timer: 0 },
  ArrowDown: { pressed: false, timer: 0 }
};

const DAS = 130;
const ARR = 35;
const SOFT_DROP_RATE = 35;

function handleInput(deltaTime) {
  if (isPaused) return;

  ['ArrowLeft', 'ArrowRight'].forEach(key => {
    const k = keys[key];
    if (k.pressed) {
      k.timer += deltaTime;
      if (k.timer > DAS) {
        if ((k.timer - DAS) % ARR < deltaTime) {
          playerMove(key === 'ArrowLeft' ? -1 : 1);
        }
      }
    }
  });

  const down = keys['ArrowDown'];
  if (down.pressed) {
    down.timer += deltaTime;
    if (down.timer >= SOFT_DROP_RATE) {
      playerDrop();
      down.timer = 0;
    }
  }
}

window.addEventListener('keydown', event => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(event.code)) {
    event.preventDefault();
  }

  if (event.code === 'KeyP' || event.code === 'Escape') {
    togglePause();
    return;
  }

  if (event.repeat || !player.isPlaying || isPaused) return;

  if (event.code === 'ArrowLeft') {
    keys.ArrowLeft.pressed = true;
    keys.ArrowLeft.timer = 0;
    playerMove(-1);
  } else if (event.code === 'ArrowRight') {
    keys.ArrowRight.pressed = true;
    keys.ArrowRight.timer = 0;
    playerMove(1);
  } else if (event.code === 'ArrowDown') {
    keys.ArrowDown.pressed = true;
    keys.ArrowDown.timer = 0;
    playerDrop();
  } else if (event.code === 'ArrowUp') {
    playerRotate(1);
  } else if (event.code === 'Space') {
    playerHardDrop();
  }
});

window.addEventListener('keyup', event => {
  if (keys[event.code]) {
    keys[event.code].pressed = false;
    keys[event.code].timer = 0;
  }
});

let isKeypadActive = false;
function autoDetectMobileTouch() {
  const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || (window.innerWidth <= 768);
  if (isTouchDevice) {
    setKeypadState(true);
  }
}

function setKeypadState(active) {
  isKeypadActive = active;
  const panel = document.getElementById('touch-bottom-panel');
  const btn = document.getElementById('btn-keypad-toggle');
  if (isKeypadActive) {
    panel.classList.add('active');
    btn.classList.add('on');
  } else {
    panel.classList.remove('active');
    btn.classList.remove('on');
  }
  updateResponsiveLayout();
}

function toggleVirtualKeypad() {
  setKeypadState(!isKeypadActive);
}

function setupTouchButton(btnId, action) {
  const el = document.getElementById(btnId);
  if (!el) return;

  const startAction = (e) => {
    e.preventDefault();
    e.stopPropagation();
    el.classList.add('touched');
    if (!player.isPlaying || isPaused) return;

    if (action === 'left') {
      keys.ArrowLeft.pressed = true;
      keys.ArrowLeft.timer = 0;
      playerMove(-1);
    } else if (action === 'right') {
      keys.ArrowRight.pressed = true;
      keys.ArrowRight.timer = 0;
      playerMove(1);
    } else if (action === 'down') {
      keys.ArrowDown.pressed = true;
      keys.ArrowDown.timer = 0;
      playerDrop();
    } else if (action === 'rot') {
      playerRotate(1);
    } else if (action === 'hard') {
      playerHardDrop();
    }
  };

  const stopAction = (e) => {
    e.preventDefault();
    e.stopPropagation();
    el.classList.remove('touched');
    if (action === 'left') keys.ArrowLeft.pressed = false;
    if (action === 'right') keys.ArrowRight.pressed = false;
    if (action === 'down') keys.ArrowDown.pressed = false;
  };

  el.addEventListener('touchstart', startAction, { passive: false });
  el.addEventListener('touchend', stopAction, { passive: false });
  el.addEventListener('touchcancel', stopAction, { passive: false });

  el.addEventListener('mousedown', startAction);
  el.addEventListener('mouseup', stopAction);
  el.addEventListener('mouseleave', stopAction);
}

setupTouchButton('v-left', 'left');
setupTouchButton('v-right', 'right');
setupTouchButton('v-down', 'down');
setupTouchButton('v-up', 'rot');
setupTouchButton('v-drop', 'hard');

/* 7. 메인 루프 */
let dropCounter = 0;
let dropInterval = 800;
let lastTime = 0;

function update(time = 0) {
  const deltaTime = time - lastTime;
  lastTime = time;

  if (player.isPlaying && !isPaused) {
    handleInput(deltaTime);
    updateParticles();

    dropCounter += deltaTime;
    if (dropCounter > dropInterval) {
      playerDrop();
    }

    if (isGrounded()) {
      lockTimer += deltaTime;
      if (lockTimer >= LOCK_DELAY) {
        lockPiece();
      }
    } else {
      lockTimer = 0;
    }
  }

  draw();
  requestAnimationFrame(update);
}

/* 8. 초기화 실행 */
fetchLeaderboard();
applyBoardSize('standard');
resetGameBoard(1);
autoDetectMobileTouch();
update();
</script>
